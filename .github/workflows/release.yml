name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Zwei Merges kurz nacheinander dürfen nicht dieselbe CalVer-Nummer berechnen.
# Nicht abbrechen: ein halb gelaufenes Release (Tag ohne Dispatch) wäre schlimmer
# als ein wartendes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Spitze von main statt github.sha: ein in der concurrency-Gruppe
          # wartender Lauf soll auf dem Release-Commit des Vorgängers aufsetzen,
          # sonst scheitert sein Push als non-fast-forward.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          python-version: "3.13"

      - name: Run tests
        run: |
          set -euo pipefail
          uv sync --locked
          uv run pytest tests/ -q

      - name: Compute new CalVer version
        id: version
        run: |
          set -euo pipefail
          prefix="$(date -u +%Y.%-m)"
          mapfile -t existing < <(git tag -l "${prefix}.*" | sort -t. -k3 -n)
          patch="${#existing[@]}"
          new_version="${prefix}.${patch}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "New version: ${new_version}"

      - name: Build changelog entry
        id: changelog
        run: |
          set -euo pipefail
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "${last_tag}" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi

          breaking=() feat=() fix=() docs=() other=()
          # `type!:` / `type(scope)!:` markiert einen Breaking Change (Conventional Commits).
          breaking_re='^[a-z]+(\([^)]*\))?!: '
          while IFS= read -r subject; do
            [ -z "${subject}" ] && continue
            if [[ "${subject}" =~ ${breaking_re} ]]; then
              breaking+=("${subject#*: }")
              continue
            fi
            case "${subject}" in
              feat:*|feat\(*\):*) feat+=("${subject#*: }") ;;
              fix:*|fix\(*\):*) fix+=("${subject#*: }") ;;
              docs:*|docs\(*\):*) docs+=("${subject#*: }") ;;
              *) other+=("${subject}") ;;
            esac
          done < <(git log ${range} --no-merges --pretty=format:%s; echo)

          {
            echo "## [${{ steps.version.outputs.new_version }}] - $(date -u +%Y-%m-%d)"
            echo
            if [ "${#breaking[@]}" -gt 0 ]; then
              echo "### Breaking Changes"
              for l in "${breaking[@]}"; do echo "- ${l}"; done
              echo
            fi
            if [ "${#feat[@]}" -gt 0 ]; then
              echo "### Features"
              for l in "${feat[@]}"; do echo "- ${l}"; done
              echo
            fi
            if [ "${#fix[@]}" -gt 0 ]; then
              echo "### Fixes"
              for l in "${fix[@]}"; do echo "- ${l}"; done
              echo
            fi
            if [ "${#docs[@]}" -gt 0 ]; then
              echo "### Docs"
              for l in "${docs[@]}"; do echo "- ${l}"; done
              echo
            fi
            if [ "${#other[@]}" -gt 0 ]; then
              echo "### Other"
              for l in "${other[@]}"; do echo "- ${l}"; done
              echo
            fi
          } > /tmp/changelog-entry.md

          cat /tmp/changelog-entry.md

      - name: Update CHANGELOG.md
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            printf '# Changelog\n\nAll notable changes to this project are documented in this file.\n\n' > CHANGELOG.md
          fi
          header_lines=4
          { head -n "${header_lines}" CHANGELOG.md; echo; cat /tmp/changelog-entry.md; tail -n +$((header_lines + 1)) CHANGELOG.md; } > /tmp/CHANGELOG.md.new
          mv /tmp/CHANGELOG.md.new CHANGELOG.md

      - name: Bump pyproject.toml version
        run: |
          set -euo pipefail
          sed -i -E "s/^version = \".*\"\$/version = \"${{ steps.version.outputs.new_version }}\"/" pyproject.toml
          grep -m1 '^version = ' pyproject.toml
          # uv.lock records the project's own version too; without this every
          # local `uv run` rewrites it and leaves the checkout dirty.
          uv lock

      # Commit und Tag in einem atomaren Push: scheitert einer (z. B. weil main
      # inzwischen weiter ist), landet keiner — kein Tag ohne Release-Commit und
      # kein Release-Commit, dessen Version beim nächsten Lauf erneut vergeben wird.
      - name: Commit, tag and push release
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "chore(release): ${version} [skip release]"
          git tag "${version}"
          git push --atomic origin HEAD:main "refs/tags/${version}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.new_version }}" \
            --title "${{ steps.version.outputs.new_version }}" \
            --notes-file /tmp/changelog-entry.md

      # kvb-ha-map takes this version 1:1 (map version == client version).
      - name: Notify kvb-ha-map
        env:
          GH_TOKEN: ${{ secrets.KVB_HA_MAP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/christoph-teichmeister/kvb-ha-map/dispatches \
            -f event_type=kvb-hafas-client-released \
            -f "client_payload[sha]=$(git rev-parse HEAD)" \
            -f "client_payload[version]=${{ steps.version.outputs.new_version }}"
