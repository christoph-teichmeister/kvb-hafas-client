<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KVB Live-Karte</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
<link rel="stylesheet" href="shared.css">
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<style>
  :root { --controls-gap: 0px; }
  body { display: flex; flex-direction: column; }
  #map { flex: 1; min-height: 0; }
  .veh { border-radius: 10px; color: #fff; font-weight: 700; font-size: 11px;
         text-align: center; line-height: 18px; height: 18px; min-width: 26px; padding: 0 3px;
         box-shadow: 0 1px 4px rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.8);
         white-space: nowrap; }
  .veh-tram { background: #b00; }
  .veh-bus  { background: #06c; }
  .veh-rail { background: #444; }
  .veh.late { border-color: #fc0; box-shadow: 0 0 0 2px #fc0, 0 1px 4px rgba(0,0,0,.4); }
  .veh.highlight { border-color: #0af; box-shadow: 0 0 0 3px #0af, 0 1px 4px rgba(0,0,0,.4); }
  .locate-btn {
    background: var(--surface-elevated); color: var(--text-primary); border: none;
    width: 30px; height: 30px; line-height: 30px; font-size: 15px; cursor: pointer;
    display: block; padding: 0; text-align: center;
  }
  .locate-btn:hover { background: var(--surface-sunken); }
  /* Neutral gray clusters instead of the library's default green/yellow/orange
     — those would read as a 4th, unrelated mode color next to the existing
     tram/bus/rail marker color-coding. */
  .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(68, 68, 68, .45); }
  .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
    background-color: rgba(68, 68, 68, .85); color: #fff; font-weight: 700;
  }
  .veh .d { font-weight: 400; opacity: .9; }
  .panel { position: absolute; z-index: 1000; background: var(--surface-elevated);
           color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-sm);
           padding: 10px 12px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                font-size: 12px; font-weight: 600; cursor: pointer; }
  .panel-head .chev { color: var(--text-secondary); transition: transform .15s; flex: none; }
  #controls-head[aria-expanded="false"] .chev,
  #alert-head[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .info-btn { border: none; background: transparent; color: var(--text-secondary); cursor: pointer;
              font-size: 13px; padding: 0 0 0 8px; flex: none; }
  #controls { top: 62px; right: 10px; width: 230px; max-height: calc(100vh - 82px); overflow: auto; }
  #controls-body { margin-top: 8px; }
  #controls.collapsed #controls-body { display: none; }
  #controls .search input {
    width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px;
    background: var(--surface); color: var(--text-primary);
  }
  #controls .search input:focus { outline: none; box-shadow: var(--focus-ring); }
  #controls fieldset.cat-group { border: none; border-top: 1px solid var(--border); margin: 0 0 8px; padding: 8px 0 0; }
  #controls fieldset.cat-group:first-of-type { border-top: none; }
  #controls legend { font-size: 12px; font-weight: 600; padding: 0; }
  #controls label { display: block; margin: 4px 0; font-size: 13px; }
  #controls details { margin: 2px 0 0 20px; }
  #controls details summary { cursor: pointer; font-size: 11.5px; color: var(--text-secondary); }
  #controls .sub { margin-left: 20px; color: var(--text-secondary); font-size: 12px; }
  #controls .toggle-row { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
  #reset-filters {
    width: 100%; margin-top: 8px; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary);
    font-size: 12px; cursor: pointer;
  }
  #reset-filters:hover { background: var(--surface-sunken); color: var(--text-primary); }
  #status { left: 10px; bottom: calc(10px + var(--controls-gap)); max-width: 60vw; font-size: 12px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: help;
            transition: bottom .15s ease; }
  #status.error { background: var(--negative-tint); color: var(--negative); }
  #tilewarn { top: 62px; left: 50%; translate: -50% 0; max-width: min(90vw, 480px);
              background: var(--negative-tint); color: var(--negative); }
  #bottomright { position: absolute; right: 10px; bottom: 10px; z-index: 1000;
                 display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #alertlist { position: static; width: 300px; max-height: 40vh; overflow: auto; display: none; }
  #alert-body.collapsed { display: none; }
  #prefetch { position: static; width: 360px; max-width: calc(100vw - 40px); font-size: 12px;
              display: none; opacity: 0; translate: 0 6px;
              transition: opacity .25s ease, translate .25s ease, display .25s allow-discrete; }
  #prefetch.show { display: block; opacity: 1; translate: 0 0; }
  @starting-style { #prefetch.show { opacity: 0; translate: 0 6px; } }
  @media (prefers-reduced-motion: reduce) { #prefetch { transition: none; } }
  #prefetch b { font-size: 13px; }
  #prefetch .sub { color: var(--text-secondary); margin-top: 3px; }
  #prefetch .now { color: var(--text-primary); margin-top: 3px; word-break: break-word; }
  #prefetch .bar { height: 6px; margin-top: 5px; border-radius: 3px; background: var(--surface-sunken); overflow: hidden; }
  #prefetch .bar i { display: block; height: 100%; background: var(--accent); }
  #prefetch .explain { display: none; }
  #prefetch .explain.show { display: block; }
  #alertlist li { margin-bottom: 8px; font-size: 12px; }
  #alertlist ul { margin: 4px 0 0; padding-left: 16px; }
  .user-dot { width: 14px; height: 14px; border-radius: 50%; background: #06c; border: 2px solid #fff;
              box-shadow: 0 1px 4px rgba(0,0,0,.5); box-sizing: border-box; }
  .user-dot.manual { background: #fff; border: 4px solid #06c; }
  .eta-btn { margin-top: 6px; padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
             background: var(--surface); color: var(--text-primary); font-size: 12px; cursor: pointer; }
  .eta-btn:hover { background: var(--surface-sunken); }
  #eta { position: static; width: 300px; max-width: calc(100vw - 40px); font-size: 12px; display: none; }
  #eta.show { display: block; }
  #eta .panel-head { cursor: default; }
  #eta .eta-big { font-size: 20px; font-weight: 700; margin-top: 4px; }
  #eta .sub { color: var(--text-secondary); margin-top: 3px; }
  #eta .warn { color: var(--negative); margin-top: 3px; }
  .alert-pin { background: #e67e00; border: 2px solid #fff; border-radius: 50%;
               width: 14px; height: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  @media (max-width: 640px) {
    #controls { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; max-height: 45vh; }
    #bottomright { right: 10px; bottom: auto; top: 62px; }
    .panel { padding: 8px 10px; }
    #prefetch, #alertlist, #eta { width: min(280px, calc(100vw - 40px)); }
    #status { max-width: calc(100vw - 20px); }
  }
</style>
</head>
<body>
<header class="app-header">
  <a class="brand" href="index.html"><span class="dot"></span>KVB Live <small style="font-weight:400;opacity:.6" title="Inoffizielles Projekt, nicht verbunden mit der Kölner Verkehrs-Betriebe AG">inoffiziell</small></a>
  <nav>

<div id="map"></div>
<div class="panel" id="controls">

  </div>
  <div id="controls-body">
  <div class="search"><input type="text" id="lines" placeholder="Linien, z.B. 1,9,18"></div>

  <fieldset class="cat-group">
    <legend>Tram/Stadtbahn</legend>
    <label><input type="checkbox" class="cat" value="tram" checked> anzeigen</label>
    <details>

  <fieldset class="cat-group">
    <legend>Bus</legend>
    <label><input type="checkbox" class="cat" value="bus" checked> anzeigen</label>
    <details>
      <summary>mehr</summary>
      <label class="sub"><input type="checkbox" class="stopcat" value="bus"> Haltestellen</label>
      <label class="sub"><input type="checkbox" class="netcat" value="bus"> Linienverläufe</label>
    </details>
  </fieldset>

  <fieldset class="cat-group">
    <legend>Bahn/S-Bahn</legend>

      <label class="sub"><input type="checkbox" class="netcat" value="rail"> Linienverläufe</label>

  <div class="toggle-row">

  <button type="button" id="reset-filters">Filter zurücksetzen</button>
  </div>
</div>
<div class="panel" id="status" role="status" aria-live="polite" aria-atomic="true">lädt …</div>
<div id="bottomright">
  <div class="panel" id="eta" role="status" aria-live="polite">
    <div class="panel-head"><b id="eta-title"></b>
      <button type="button" class="info-btn" id="eta-close" aria-label="Schließen" title="Schließen">✕</button></div>
    <div id="eta-body"></div>
  </div>
  <div class="panel" id="alertlist"></div>
  <div class="panel" id="prefetch">
    <div class="panel-head">
      <b>Lade Linienverläufe</b>
      <button type="button" id="prefetch-info-btn" class="info-btn" aria-expanded="false" aria-controls="prefetch-explain" title="Was bedeutet das?">ⓘ</button>
    </div>
    <div class="sub" id="prefetchWhat"></div>
    <div class="bar"><i id="prefetchBar" style="width:0"></i></div>
    <div class="now" id="prefetchNow"></div>
    <div class="sub explain" id="prefetch-explain">Solange eine Linie fehlt, wird sie als gerade Verbindung gezeichnet —
      ihr Streckenverlauf wird einmal je Linie/Richtung geladen und dann zwischengespeichert.</div>
  </div>
</div>
<script src="shared.js"></script>
<script>
// Every URL below is relative (no leading slash) so it resolves against the
// current page URL — including HA Ingress's dynamic base path, whatever it
// is, without this script ever needing to know it.
const LATE_FROM = 3;             // minutes delay before a vehicle counts as late
const START_RATE = 0.003;        // lines/ms, seed for the progress bar before the first measurement

let POLL_MS = 15000;
let ALERT_POLL_MS = 300000;
const NETWORK_POLL_MS = 60000;   // the server's background prefetch fills the network in over time

let map, networkLayer, stopLayer, vehicleLayer, alertLayer, etaLayer;
const networkLines = new Map();
let stopMarkers = [];
const STOP_COLOURS = { tram: '#b00', bus: '#06c', rail: '#444' };
const STOP_ZOOM = 13;

let status, alertList;
const fleet = new Map();
let vehiclePoll = null, moveTimer = null, lastPayload = null;
let refreshSeq = 0, refreshAbort = null;

// Deep-link support: dashboard.html's max-delay tile links here with
// ?line=<line>&jid=<jid> to pre-filter and pan/highlight one vehicle.
const deepLinkParams = new URLSearchParams(location.search);
const deepLinkLine = deepLinkParams.get('line');
const deepLinkJid = deepLinkParams.get('jid');
let deepLinkHandled = !(deepLinkLine || deepLinkJid);

const CAT_COLOURS = [[/s-?bahn/, '#008d4f'], [/ice|^ic$|fern|tha|flx/, '#ec0016'], [/re|rb|regio|sev/, '#646973']];

// Only validated hex colours from HAFAS are used (they end up in style
// attributes); white or anything else falls back to the category colour.
function lineColour(colour, category) {
  const hex = safeColour(colour);
  if (hex && !/^#f{3}(f{3})?$/i.test(hex)) return hex;
  const c = (category || '').toLowerCase();
  return (CAT_COLOURS.find(([re]) => re.test(c)) || [null, '#888'])[1];
}

function cssClass(category) {
  const c = (category || '').toLowerCase();
  if (c.includes('str') || c.includes('tram') || c.includes('stadtbahn')) return 'tram';
  if (c.includes('bus')) return 'bus';
  return 'rail';
}

function filters() {
  const raw = document.getElementById('lines').value.trim();
  return {
    lines: raw ? raw.split(',').map(s => s.trim().toLowerCase()).filter(Boolean) : null,
    cats: new Set([...document.querySelectorAll('.cat:checked')].map(c => c.value)),
    onlyLate: document.getElementById('onlyLate').checked,
  };
}

function matches(v, f) {
  if (!f.cats.has(cssClass(v.category))) return false;
  if (f.lines && !f.lines.includes(String(v.line).toLowerCase())) return false;
  if (f.onlyLate && !(v.delay >= LATE_FROM)) return false;
  return true;
}

function iconHtml(v) {
  const late = v.delay >= LATE_FROM;
  const suffix = late ? ` <span class="d">+${esc(v.delay)}</span>` : '';
  const colour = lineColour(v.colour, v.category);
  const text = v.colour === colour ? safeColour(v.text_colour, '#fff') : '#fff';
  const style = colour ? ` style="background:${colour};color:${text}"` : '';
  const highlighted = (deepLinkJid && v.jid === deepLinkJid) || (watched && watched.jid === v.jid);
  const cls = `veh veh-${cssClass(v.category)}${late ? ' late' : ''}${highlighted ? ' highlight' : ''}`;
  return `<div class="${cls}"${style}>${esc(v.line)}${suffix}</div>`;
}

function icon(v) {
  return L.divIcon({ className: '', iconSize: null, html: iconHtml(v) });
}

// setIcon() rebuilds the marker's DOM (and, inside the cluster group, its
// cluster bookkeeping) — only do it when the markup actually changed.
function updateIcon(entry) {
  const html = iconHtml(entry.vehicle);
  if (html === entry.iconHtml) return;
  entry.iconHtml = html;
  entry.marker.setIcon(L.divIcon({ className: '', iconSize: null, html }));
}

function popup(v) {
  const delay = v.delay === null || v.delay === undefined ? 'keine Echtzeitdaten'
    : v.delay > 0 ? `${esc(v.delay)} Min. verspätet` : v.delay < 0 ? `${esc(-v.delay)} Min. zu früh` : 'pünktlich';
  return `<b>${esc(v.line)}</b> → ${esc(v.direction)}<br>nächster Halt: ${esc(v.next_stop || '—')}<br>${delay}`
    + `<br><button type="button" class="eta-btn" data-jid="${esc(v.jid)}">⏱ Wann ist sie bei mir?</button>`;
}

function positionAt(track, elapsed) {
  if (!track.length) return null;
  if (elapsed <= track[0][0]) return [track[0][1], track[0][2]];
  for (let i = 1; i < track.length; i++) {
    const [t0, la0, lo0] = track[i - 1], [t1, la1, lo1] = track[i];
    if (elapsed <= t1) {
      const r = t1 === t0 ? 0 : (elapsed - t0) / (t1 - t0);
      return [la0 + (la1 - la0) * r, lo0 + (lo1 - lo0) * r];
    }
  }
  const last = track[track.length - 1];
  return [last[1], last[2]];
}

// Vehicle positions are interpolated along their track, but markers only
// move ~1x per second and only when the step is visible (>= 1 px): inside
// the cluster group every setLatLng() removes and re-adds the marker, i.e.
// rebuilds its DOM (and re-opens an open popup). Off-screen markers and the
// one whose popup is open stay put (the latter so its buttons stay usable;
// it catches up once the popup closes). The prefetch bar keeps animating
// per frame — it is a single cheap style update.
const MOVE_INTERVAL_MS = 1000;
const MIN_MOVE_PX = 1;
let lastMoveAt = 0;

function moveVehicles(now) {
  const zoom = map.getZoom();
  const view = map.getBounds().pad(0.25);
  for (const v of fleet.values()) {
    if (!v.shown) continue;
    const p = positionAt(v.track, now - v.servedAt);
    if (!p) continue;
    const cur = v.marker.getLatLng();
    if (!view.contains(cur) && !view.contains(p)) continue;
    if (v.marker.isPopupOpen && v.marker.isPopupOpen()) continue;
    const a = map.project(cur, zoom), b = map.project(p, zoom);
    if (Math.abs(a.x - b.x) < MIN_MOVE_PX && Math.abs(a.y - b.y) < MIN_MOVE_PX) continue;
    v.marker.setLatLng(p);
  }
}

function animate() {
  const now = Date.now();
  animatePrefetch(now);
  if (now - lastMoveAt >= MOVE_INTERVAL_MS) {
    lastMoveAt = now;
    moveVehicles(now);
    if (watched) renderEtaLine();
  }
  requestAnimationFrame(animate);
}

// A pan/zoom fires a new request while the old one may still be pending;
// abort the old one and drop any answer that isn't for the latest request,
// so a slow response for the previous bbox can't overwrite the current view.
async function refresh() {
  const b = map.getBounds();
  const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()]
    .map(n => n.toFixed(5)).join(',');
  const seq = ++refreshSeq;
  if (refreshAbort) refreshAbort.abort();
  const ctrl = refreshAbort = (typeof AbortController === 'function') ? new AbortController() : null;
  try {
    const data = await fetchJson(`api/vehicles?bbox=${bbox}`, ctrl ? { signal: ctrl.signal } : undefined);
    if (seq !== refreshSeq) return;
    if (!Array.isArray(data.vehicles)) throw new Error('Unerwartete Antwort vom Server');
    lastPayload = data;
    apply(data);
  } catch (err) {
    if (seq !== refreshSeq || (err && err.name === 'AbortError')) return;
    status.textContent = `Fehler: ${friendlyError(err)}`;
    status.classList.add('error');
  } finally {
    if (refreshAbort === ctrl) refreshAbort = null;
  }
}

function apply(data) {
  const f = filters(), seen = new Set();
  for (const v of data.vehicles) {
    seen.add(v.jid);
    const track = Array.isArray(v.track) && v.track.length ? v.track : [[0, v.lat, v.lon]];
    let entry = fleet.get(v.jid);
    if (!entry) {
      const html = iconHtml(v);
      entry = { marker: L.marker([v.lat, v.lon], { icon: L.divIcon({ className: '', iconSize: null, html }) }),
                iconHtml: html, track, servedAt: data.served_at, shown: false, popupHtml: null };
      fleet.set(v.jid, entry);
      entry.vehicle = v;
    } else {
      entry.track = track;
      entry.servedAt = data.served_at;
      entry.vehicle = v;
      updateIcon(entry);
    }
    // Re-binding re-renders an open popup; only touch it when the text changed.
    const html = popup(v);
    if (html !== entry.popupHtml) {
      entry.popupHtml = html;
      if (entry.marker.getPopup()) entry.marker.setPopupContent(html); else entry.marker.bindPopup(html);
    }
    show(entry, matches(v, f));
  }
  for (const [jid, entry] of fleet) {
    if (!seen.has(jid)) { vehicleLayer.removeLayer(entry.marker); fleet.delete(jid); }
  }
  render(data);
  tryDeepLinkFocus();
}

function tryDeepLinkFocus() {
  if (deepLinkHandled) return;
  deepLinkHandled = true; // attempt exactly once, even if the jid never shows up
  if (!deepLinkJid) return; // line-only deep link: the #lines filter already applied
  const entry = fleet.get(deepLinkJid);
  if (!entry) {
    status.textContent = `Fahrzeug ist derzeit nicht aktiv — Filter auf Linie ${deepLinkLine || ''} angewendet.`;
    return;
  }
  show(entry, true);
  const focus = () => {
    map.setView(entry.marker.getLatLng(), Math.max(map.getZoom(), 16));
    entry.marker.openPopup();
  };
  // The marker may currently be clustered — zoomToShowLayer un-clusters/
  // spiderfies it first, then calls back once it's safe to open the popup.
  if (typeof vehicleLayer.zoomToShowLayer === 'function') {
    vehicleLayer.zoomToShowLayer(entry.marker, focus);
  } else {
    focus();
  }
}

function show(entry, visible) {
  if (visible === entry.shown) return;
  if (visible) vehicleLayer.addLayer(entry.marker); else vehicleLayer.removeLayer(entry.marker);
  entry.shown = visible;
}

let prefetch = null;

function renderPrefetch(p) {
  const box = document.getElementById('prefetch');
  if (!p || !p.pending) { box.classList.remove('show'); prefetch = null; return; }
  const done = Math.max(0, p.queued - p.pending);
  const now = Date.now();
  let rate = prefetch ? prefetch.rate : START_RATE;
  if (prefetch && now > prefetch.at && done > prefetch.done) {
    const measured = (done - prefetch.done) / (now - prefetch.at);
    rate = rate ? rate * 0.5 + measured * 0.5 : measured;
  }
  prefetch = { done, queued: p.queued, at: now, rate,
              shown: prefetch ? prefetch.shown : done, pct: prefetch ? prefetch.pct : 0 };
  box.classList.add('show');
  document.getElementById('prefetchWhat').textContent =
    `${done} von ${p.queued} Linien/Richtungen geladen${eta(rate, p.pending)}`;
  document.getElementById('prefetchNow').textContent =
    p.current && p.current.length ? `gerade: ${p.current.join(', ')}` : '';
}

function animatePrefetch(now) {
  if (!prefetch) return;
  const predicted = prefetch.done + prefetch.rate * (now - prefetch.at);
  const cap = prefetch.queued - 0.5;
  prefetch.shown = Math.max(prefetch.shown, Math.min(predicted, cap));
  const pct = prefetch.queued ? (prefetch.shown / prefetch.queued) * 100 : 0;
  prefetch.pct = Math.max(prefetch.pct || 0, pct);
  document.getElementById('prefetchBar').style.width = `${prefetch.pct}%`;
}

function eta(rate, pending) {
  if (!rate) return '';
  const left = Math.round(pending / rate / 1000);
  if (!isFinite(left) || left <= 0) return '';
  return left < 60 ? ` · noch ~${left}s` : ` · noch ~${Math.round(left / 60)}min`;
}

function render(data) {
  renderPrefetch(data.prefetch);
  const shown = [...fleet.values()].filter(e => e.shown);
  const late = shown.filter(e => e.vehicle.delay >= LATE_FROM).length;
  const geo = data.known_segments || 0;
  status.classList.remove('error');
  const drawn = networkLayer.getLayers().length;
  const time = fmtBerlin(data.served_at, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  status.textContent = `${shown.length}/${data.vehicles.length} Fahrzeuge · ${late} verspätet · ${time}`;
  status.title = `${drawn} von ${geo} Streckensegmenten gezeichnet (gefiltert) · Stand ${time}`;
}

function refilter() {
  const f = filters();
  for (const entry of fleet.values()) show(entry, matches(entry.vehicle, f));
  drawNetwork();
  drawStops();
  if (lastPayload) render(lastPayload);
}

async function refreshAlerts() {
  if (!document.getElementById('showAlerts').checked) return;
  try {
    const data = await fetchJson('api/alerts');
    const alerts = Array.isArray(data.alerts) ? data.alerts : [];
    alertLayer.clearLayers();
    for (const a of alerts) {
      const stops = Array.isArray(a.stops) ? a.stops : [];
      for (const [lat, lon] of (Array.isArray(a.points) ? a.points : [])) {
        L.marker([lat, lon], { icon: L.divIcon({ className: '', html: '<div class="alert-pin"></div>' }) })
          .bindPopup(`<b>${esc(stops.join(', ') || 'Störung')}</b><br>${esc(a.text)}`)
          .addTo(alertLayer);
      }
    }
    const textOnly = alerts.filter(a => !(Array.isArray(a.points) && a.points.length));
    // Keep the user's expand/collapse choice across the periodic refresh.
    const prevBody = document.getElementById('alert-body');
    const expanded = !!prevBody && !prevBody.classList.contains('collapsed');
    alertList.innerHTML = `<div class="panel-head" id="alert-head" role="button" tabindex="0" aria-expanded="${expanded}" aria-controls="alert-body">
        <b>${alerts.length} Störungsmeldungen</b><span class="chev" aria-hidden="true">▾</span>
      </div>
      <div id="alert-body"${expanded ? '' : ' class="collapsed"'}>${textOnly.length
        ? `<ul>${textOnly.map(a => `<li>${esc(a.text)}</li>`).join('')}</ul>`
        : '<div class="sub">Details auf der Karte antippen.</div>'}</div>`;
  } catch (err) {
    alertList.textContent = `Störungsmeldungen: ${friendlyError(err)}`;
  }
}

async function loadNetwork() {
  const data = await fetchJson('api/network');
  networkLines.clear();
  for (const line of (Array.isArray(data.lines) ? data.lines : [])) {
    const colour = lineColour(line.colour, line.category);
    const polylines = line.paths.map(path => {
      const schematic = path.length < 3;
      return L.polyline(path, { color: colour, weight: schematic ? 2 : 4, opacity: 0.75,
        dashArray: schematic ? '6 6' : null }).bindPopup(`Linie ${esc(line.line)}`);
    });
    networkLines.set(String(line.line), { polylines, category: line.category });
  }
}

function drawNetwork() {
  networkLayer.clearLayers();
  const cats = netCats();
  if (!cats.size) return;
  const f = filters();
  for (const [name, entry] of networkLines) {
    if (!cats.has(cssClass(entry.category))) continue;
    if (f.lines && !f.lines.includes(name.toLowerCase())) continue;
    entry.polylines.forEach(p => networkLayer.addLayer(p));
  }
}

function netCats() {
  return new Set([...document.querySelectorAll('.netcat:checked')].map(c => c.value));
}

function stopCats() {
  return new Set([...document.querySelectorAll('.stopcat:checked')].map(c => c.value));
}

async function loadStops() {
  const data = await fetchJson('api/stops');
  stopMarkers = (Array.isArray(data.stops) ? data.stops : []).map(stop => {
    const stopLines = Array.isArray(stop.lines) ? stop.lines.map(String) : [];
    const cats = new Set((Array.isArray(stop.cats) ? stop.cats : []).map(cssClass));
    const lines = stopLines.length ? `<br>${esc(stopLines.join(', '))}` : '';
    return {
      cats,
      lines: stopLines.map(l => l.toLowerCase()),
      marker: L.circleMarker([stop.lat, stop.lon], { radius: 4, weight: 2, color: '#fff', fillOpacity: 1 })
        .bindPopup(`<b>${esc(stop.name)}</b>${lines}`),
    };
  });
}

function drawStops() {
  stopLayer.clearLayers();
  const cats = stopCats();
  if (!cats.size || map.getZoom() < STOP_ZOOM) return;
  const f = filters();
  for (const entry of stopMarkers) {
    const hit = ['rail', 'tram', 'bus'].find(c => cats.has(c) && entry.cats.has(c));
    if (!hit) continue;
    if (f.lines && !entry.lines.some(l => f.lines.includes(l))) continue;
    entry.marker.setStyle({ fillColor: STOP_COLOURS[hit] });
    stopLayer.addLayer(entry.marker);
  }
}

async function toggleStops() {
  if (!stopCats().size) { map.removeLayer(stopLayer); stopLayer.clearLayers(); return; }
  if (!stopMarkers.length) {
    status.textContent = 'lädt Haltestellen …';
    try {
      await loadStops();
    } catch (err) {
      status.textContent = `Haltestellen: ${friendlyError(err)}`;
      status.classList.add('error');
      return;
    }
  }
  map.addLayer(stopLayer);
  drawStops();
  if (lastPayload) render(lastPayload);
}

async function refreshNetwork() {
  if (!netCats().size) return;
  try {
    await loadNetwork();
    drawNetwork();
    if (lastPayload) render(lastPayload);
  } catch (err) { /* retry next tick */ }
}

async function toggleNetwork() {
  if (!netCats().size) { map.removeLayer(networkLayer); networkLayer.clearLayers(); return; }
  status.textContent = 'lädt Linienverläufe …';
  try {
    if (!networkLines.size) await loadNetwork();
    map.addLayer(networkLayer);
    drawNetwork();
    if (lastPayload) render(lastPayload);
  } catch (err) {
    status.textContent = `Linienverläufe: ${friendlyError(err)}`;
    status.classList.add('error');
  }
}

function toggleAlerts() {
  const on = document.getElementById('showAlerts').checked;
  alertList.style.display = on ? 'block' : 'none';
  if (on) { map.addLayer(alertLayer); refreshAlerts(); } else { map.removeLayer(alertLayer); }
}

function schedule() {
  if (vehiclePoll) vehiclePoll.restart();
  else { refresh(); vehiclePoll = pollWhileVisible(refresh, POLL_MS); }
}

const PREFS_KEY = 'kvb-map-filters';
let prefControls;
const prefKey = el => el.id || `${el.className}:${el.value}`;

function savePrefs() {
  const prefs = {};
  for (const el of prefControls) prefs[prefKey(el)] = el.type === 'checkbox' ? el.checked : el.value;
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (err) { /* private mode */ }
}

function loadPrefs() {
  let prefs;
  try { prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); } catch (err) { return; }
  for (const el of prefControls) {
    const v = prefs[prefKey(el)];
    if (v === undefined) continue;
    if (el.type === 'checkbox') el.checked = v; else el.value = v;
  }
}

function resetFilters() {
  document.getElementById('lines').value = '';
  document.querySelectorAll('.cat').forEach(c => { c.checked = true; });
  document.querySelectorAll('.stopcat, .netcat').forEach(c => { c.checked = false; });
  document.getElementById('onlyLate').checked = false;
  document.getElementById('showAlerts').checked = false;
  document.querySelectorAll('#controls details').forEach(d => { d.open = false; });
  try { localStorage.removeItem(PREFS_KEY); } catch (err) { /* private mode */ }
  refilter();
  toggleStops();
  toggleNetwork();
  toggleAlerts();
}

const CONTROLS_COLLAPSED_KEY = 'kvb-map-controls-collapsed';

function setControlsCollapsed(collapsed) {
  const panel = document.getElementById('controls');
  panel.classList.toggle('collapsed', collapsed);
  document.getElementById('controls-head').setAttribute('aria-expanded', String(!collapsed));
  try { localStorage.setItem(CONTROLS_COLLAPSED_KEY, collapsed ? '1' : '0'); } catch (err) { /* private mode */ }
}

function initControlsCollapse() {
  let stored = null;
  try { stored = localStorage.getItem(CONTROLS_COLLAPSED_KEY); } catch (err) { /* private mode */ }
  const collapsed = stored !== null ? stored === '1' : window.matchMedia('(max-width: 768px)').matches;
  setControlsCollapsed(collapsed);
  const head = document.getElementById('controls-head');
  head.addEventListener('click', () => setControlsCollapsed(!document.getElementById('controls').classList.contains('collapsed')));
  head.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    setControlsCollapsed(!document.getElementById('controls').classList.contains('collapsed'));
  });
}

function initPrefetchInfoToggle() {
  document.getElementById('prefetch-info-btn').addEventListener('click', () => {
    const btn = document.getElementById('prefetch-info-btn');
    const explain = document.getElementById('prefetch-explain');
    const show = !explain.classList.contains('show');
    explain.classList.toggle('show', show);
    btn.setAttribute('aria-expanded', String(show));
  });
}

function initControlsGap() {
  const controls = document.getElementById('controls');
  const mq = window.matchMedia('(max-width: 640px)');
  const update = () => {
    document.documentElement.style.setProperty('--controls-gap',
      mq.matches ? `${controls.getBoundingClientRect().height + 8}px` : '0px');
  };
  new ResizeObserver(update).observe(controls);
  mq.addEventListener('change', update);
  update();
}

function initAlertCollapse() {
  const toggle = (head) => {
    const body = document.getElementById('alert-body');
    if (!body) return;
    const show = body.classList.contains('collapsed');
    body.classList.toggle('collapsed', !show);
    head.setAttribute('aria-expanded', String(show));
  };
  alertList.addEventListener('click', (e) => {
    const head = e.target.closest('#alert-head');
    if (head) toggle(head);
  });
  alertList.addEventListener('keydown', (e) => {
    const head = e.target.closest('#alert-head');
    if (!head || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault();
    toggle(head);
  });
}

// --------------------------------------------------------------------------
// Own position: browser geolocation, or set by hand (long press / right click
// on the map, or dragging the marker) — geolocation needs HTTPS and a
// permission the HA app or browser may not grant.
// --------------------------------------------------------------------------
const USER_POS_KEY = 'kvb-map-user-pos';
const MANUAL_HINT = 'Tipp: lange auf die Karte drücken (oder Rechtsklick), um deinen Standort von Hand zu setzen.';
let userPos = null;   // { lat, lon, accuracy, source: 'gps' | 'manual' }
let userMarker = null, userAccuracyCircle = null, geoWatch = null;

function setUserPos(pos, center) {
  userPos = pos;
  const ll = [pos.lat, pos.lon];
  const manual = pos.source === 'manual';
  const icon = L.divIcon({ className: '', iconSize: [14, 14], html: `<div class="user-dot${manual ? ' manual' : ''}"></div>` });
  if (!userMarker) {
    userMarker = L.marker(ll, { icon, draggable: true, keyboard: false, zIndexOffset: 1000 }).addTo(map).bindPopup('');
    userMarker.on('dragend', () => {
      const p = userMarker.getLatLng();
      setManualPos(p.lat, p.lng);
    });
  } else {
    userMarker.setLatLng(ll).setIcon(icon);
  }
  userMarker.setPopupContent(manual ? 'Dein Standort (von Hand gesetzt, verschiebbar)' : 'Dein Standort');
  if (pos.accuracy) {
    if (!userAccuracyCircle) {
      userAccuracyCircle = L.circle(ll, { radius: pos.accuracy, color: '#06c', weight: 1, fillOpacity: 0.08, interactive: false }).addTo(map);
    } else {
      userAccuracyCircle.setLatLng(ll).setRadius(pos.accuracy);
    }
  } else if (userAccuracyCircle) {
    map.removeLayer(userAccuracyCircle);
    userAccuracyCircle = null;
  }
  try {
    if (manual) localStorage.setItem(USER_POS_KEY, JSON.stringify({ lat: pos.lat, lon: pos.lon }));
    else localStorage.removeItem(USER_POS_KEY);
  } catch (err) { /* private mode */ }
  if (center) map.setView(ll, Math.max(map.getZoom(), 16));
  // Only re-ask the server once the position really moved — a GPS watch
  // fires every few seconds with sub-metre jitter.
  if (watched && (!watched.at || map.distance(ll, [watched.at.lat, watched.at.lon]) > 25)) refreshEta();
}

function setManualPos(lat, lon) {
  stopGeoWatch();
  setUserPos({ lat, lon, accuracy: null, source: 'manual' }, false);
  status.textContent = 'Standort von Hand gesetzt — Punkt ist verschiebbar.';
  status.classList.remove('error');
}

function restoreManualPos() {
  try {
    const saved = JSON.parse(localStorage.getItem(USER_POS_KEY) || 'null');
    if (saved && isFinite(saved.lat) && isFinite(saved.lon)) setUserPos({ ...saved, accuracy: null, source: 'manual' }, false);
  } catch (err) { /* private mode or garbage */ }
}

function stopGeoWatch() {
  if (geoWatch !== null) navigator.geolocation.clearWatch(geoWatch);
  geoWatch = null;
}

function geoError(message) {
  status.textContent = `${message} ${MANUAL_HINT}`;
  status.title = status.textContent;
  status.classList.add('error');
  return message;
}

// Resolves to null on success, else to the error message (also shown in the status line).
function locateMe() {
  if (!window.isSecureContext) {
    return Promise.resolve(geoError('Standortbestimmung braucht HTTPS — diese Seite ist unverschlüsselt geöffnet.'));
  }
  if (!navigator.geolocation) {
    return Promise.resolve(geoError('Standortbestimmung wird von diesem Browser nicht unterstützt.'));
  }
  status.textContent = 'Standort wird ermittelt …';
  status.classList.remove('error');
  const fromCoords = (c) => ({ lat: c.latitude, lon: c.longitude, accuracy: c.accuracy, source: 'gps' });
  return new Promise((resolve) => navigator.geolocation.getCurrentPosition(
    (pos) => {
      setUserPos(fromCoords(pos.coords), true);
      status.classList.remove('error');
      status.textContent = `Standort gefunden (±${Math.round(pos.coords.accuracy)} m)`;
      if (geoWatch === null) {
        geoWatch = navigator.geolocation.watchPosition(
          (p) => setUserPos(fromCoords(p.coords), false), () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
      }
      resolve(null);
    },
    (err) => {
      const messages = {
        1: 'Standortzugriff wurde verweigert — Berechtigung im Browser bzw. in der App prüfen.',
        2: 'Standort konnte nicht ermittelt werden.',
        3: 'Zeitüberschreitung bei der Standortbestimmung.',
      };
      resolve(geoError(messages[err.code] || `Standort konnte nicht ermittelt werden (${err.message}).`));
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  ));
}

// --------------------------------------------------------------------------
// "Wann ist sie bei mir?" — ETA of one trip at the own position. The server
// projects the position onto the trip's route and interpolates the time
// there; this side only polls it (server-side cache: 1 KVB request per trip
// and 30 s) and counts down in between.
// --------------------------------------------------------------------------
const ETA_REFRESH_MS = 30000;
let watched = null;       // { jid, data, error, hint, skew, at, tick, refresh, line }

function clock(ms) {
  return new Date(ms).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });
}

function delayText(minutes, realtime) {
  if (!realtime) return ' · laut Fahrplan';
  return minutes > 0 ? ` (+${minutes})` : minutes < 0 ? ` (${minutes})` : '';
}

function untilText(ms) {
  const left = (ms - (Date.now() + watched.skew)) / 1000;
  if (left < -30) return 'schon vorbei';
  if (left < 30) return 'jetzt';
  if (left < 60) return 'in < 1 Min.';
  return `in ${Math.round(left / 60)} Min.`;
}

async function watchEta(jid) {
  map.closePopup();
  stopEta();
  const current = watched = { jid, data: null, error: null, hint: null, skew: 0, at: null, line: null };
  refreshVehicleIcon(jid);
  renderEta();
  if (!userPos) {
    const failed = await locateMe();
    if (watched !== current) return;
    if (failed) {
      current.hint = `${failed} ${MANUAL_HINT}`;
      renderEta();
      return;  // setUserPos() via long press picks it up from here
    }
  }
  await refreshEta();  // starts the countdown/refresh timers on its first answer
}

function stopEta() {
  if (!watched) return;
  clearInterval(watched.tick);
  if (watched.refresh) watched.refresh.stop();
  const jid = watched.jid;
  watched = null;
  etaLayer.clearLayers();
  refreshVehicleIcon(jid);
  renderEta();
}

function refreshVehicleIcon(jid) {
  const entry = fleet.get(jid);
  if (entry) updateIcon(entry);
}

async function refreshEta() {
  if (!watched || !userPos) return;
  const current = watched;
  current.at = { lat: userPos.lat, lon: userPos.lon };
  current.hint = null;
  try {
    const q = `jid=${encodeURIComponent(current.jid)}&lat=${userPos.lat.toFixed(6)}&lon=${userPos.lon.toFixed(6)}`;
    const data = await fetchJson(`api/journey/eta?${q}`);
    if (watched !== current) return;
    current.data = data;
    current.error = null;
    current.skew = Number.isFinite(data.computed_at) ? data.computed_at - Date.now() : 0;
  } catch (err) {
    if (watched !== current) return;
    current.error = friendlyError(err);
  }
  if (!current.tick) {
    current.tick = setInterval(renderEta, 1000);
    current.refresh = pollWhileVisible(refreshEta, ETA_REFRESH_MS);
  }
  drawEta();
  renderEta();
}

function drawEta() {
  etaLayer.clearLayers();
  const d = watched && watched.data;
  watched.line = null;
  if (!d || !d.point) return;
  L.circleMarker(d.point, { radius: 8, weight: 3, color: '#e67e00', fillColor: '#fff', fillOpacity: 1 })
    .bindTooltip('Hier fährt sie an dir vorbei').addTo(etaLayer);
  watched.line = L.polyline([d.point, d.point], { color: '#e67e00', weight: 3, dashArray: '6 6', interactive: false })
    .addTo(etaLayer);
}

// Dashed line from the watched vehicle to the passing point; follows the
// marker (moved by animate()) without re-rendering the ETA panel.
function renderEtaLine() {
  if (!watched || !watched.line) return;
  const d = watched.data;
  const entry = fleet.get(watched.jid);
  if (entry && d && d.status === 'approaching') watched.line.setLatLngs([entry.marker.getLatLng(), d.point]);
  else watched.line.setLatLngs([]);
}

function renderEta() {
  const box = document.getElementById('eta');
  if (!watched) { box.classList.remove('show'); return; }
  box.classList.add('show');
  const d = watched.data;
  const entry = fleet.get(watched.jid);
  const v = entry && entry.vehicle;
  document.getElementById('eta-title').textContent =
    `⏱ ${d ? `${d.line} → ${d.direction}` : v ? `${v.line} → ${v.direction}` : 'Fahrt'}`;
  renderEtaLine();

  let html;
  if (watched.hint) {
    html = `<div class="warn">${esc(watched.hint)}</div>`;
  } else if (!d) {
    html = watched.error ? `<div class="warn">${esc(watched.error)}</div>` : '<div class="sub">wird berechnet …</div>';
  } else {
    if (d.status === 'not_on_route') {
      html = `<div class="eta-big">kommt nicht bei dir vorbei</div>
        <div class="sub">Die Strecke ist mehr als ${esc(d.max_route_distance_m)} m von deinem Standort entfernt.</div>`;
    } else {
      const when = d.status === 'passed' ? 'fährt von dir weg' : untilText(d.eta);
      const between = Array.isArray(d.between) ? d.between : [];
      html = `<div class="eta-big">${esc(when)}</div>
        <div class="sub">${esc(clock(d.eta))}${esc(delayText(d.delay_minutes, d.realtime))} · ${esc(d.distance_m)} m von dir,
          zwischen ${esc(between[0])} und ${esc(between[1])}</div>`;
      if (d.cancelled) html += '<div class="warn">Halt auf diesem Abschnitt fällt aus.</div>';
    }
    const s = d.nearest_stop;
    if (s) {
      html += `<div class="sub">Haltestelle ${esc(s.name)} (${esc(s.distance_m)} m): ${esc(untilText(s.eta))},
        ${esc(clock(s.eta))}${esc(delayText(s.delay_minutes, s.realtime))}${s.cancelled ? ' — fällt aus' : ''}</div>`;
    }
    if (userPos && userPos.accuracy > 150) html += `<div class="warn">Standort ungenau (±${Math.round(userPos.accuracy)} m).</div>`;
    if (watched.error) html += `<div class="warn">Aktualisierung fehlgeschlagen: ${esc(watched.error)}</div>`;
  }
  document.getElementById('eta-body').innerHTML = html;
}

const LocateControl = L.Control.extend({
  options: { position: 'topleft' },
  onAdd: function () {
    const btn = L.DomUtil.create('button', 'locate-btn leaflet-bar');
    btn.type = 'button';
    btn.title = 'Meinen Standort anzeigen';
    btn.setAttribute('aria-label', 'Meinen Standort anzeigen');
    btn.textContent = '📍';
    L.DomEvent.disableClickPropagation(btn);
    L.DomEvent.on(btn, 'click', () => { locateMe(); });
    return btn;
  },
});

function warnOnTileErrors(tileLayer, hasCustomTileUrl) {
  let failed = 0;
  tileLayer.on('tileerror', () => {
    failed++;
    if (failed < 4 || document.getElementById('tilewarn')) return;
    const div = document.createElement('div');
    div.id = 'tilewarn';
    div.className = 'panel';
    div.innerHTML = hasCustomTileUrl
      ? 'Kartenkacheln konnten nicht geladen werden. Prüfe die Optionen <code>tile_url</code>/<code>tile_attribution</code> (falsche URL-Vorlage, fehlender/ungültiger API-Key, oder Domain nicht beim Anbieter freigegeben).'
      : 'Kartenkacheln konnten nicht geladen werden — die kostenlose Standardquelle blockiert diese Anfrage. Setze eine <code>tile_url</code> (z.B. aus dem kostenlosen Tarif von <a href="https://stadiamaps.com/" target="_blank" rel="noopener">Stadia Maps</a>) in den App-Optionen. Siehe den Abschnitt „Map tiles“ in der README.';
    document.body.appendChild(div);
  });
}

async function init() {
  let cfg = { default_map_center: { lat: 50.9375, lon: 6.9603 }, default_zoom: 13,
              vehicle_poll_cache_ttl_seconds: 15, alert_cache_ttl_seconds: 300 };
  try {
    cfg = { ...cfg, ...(await fetchJson('api/config')) };
  } catch (err) { /* fall back to defaults above */ }
  POLL_MS = (cfg.vehicle_poll_cache_ttl_seconds || 15) * 1000;
  ALERT_POLL_MS = (cfg.alert_cache_ttl_seconds || 300) * 1000;

  map = L.map('map').setView([cfg.default_map_center.lat, cfg.default_map_center.lon], cfg.default_zoom || 13);
  const tileLayer = L.tileLayer(cfg.tile_url || 'https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: cfg.tile_attribution || 'Map <a href="https://wikimediafoundation.org/wiki/Maps_Terms_of_Use">Wikimedia</a> | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  warnOnTileErrors(tileLayer, !!cfg.tile_url);
  map.addControl(new LocateControl());
  networkLayer = L.layerGroup();
  stopLayer = L.layerGroup();
  vehicleLayer = L.markerClusterGroup({
    maxClusterRadius: 50,
    disableClusteringAtZoom: 15,
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: false,
  }).addTo(map);
  alertLayer = L.layerGroup();
  etaLayer = L.layerGroup().addTo(map);

  status = document.getElementById('status');
  alertList = document.getElementById('alertlist');
  prefControls = [...document.querySelectorAll('#controls input')];

  document.getElementById('lines').addEventListener('input', refilter);
  document.getElementById('onlyLate').addEventListener('change', refilter);
  document.querySelectorAll('.cat').forEach(c => c.addEventListener('change', () => {
    const stops = document.querySelector(`.stopcat[value="${c.value}"]`);
    const net = document.querySelector(`.netcat[value="${c.value}"]`);
    if (!c.checked && stops.checked) { stops.checked = false; savePrefs(); toggleStops(); }
    if (!c.checked && net.checked) { net.checked = false; savePrefs(); toggleNetwork(); }
    refilter();
  }));
  document.getElementById('showAlerts').addEventListener('change', toggleAlerts);
  document.querySelectorAll('.stopcat').forEach(c => c.addEventListener('change', toggleStops));
  document.querySelectorAll('.netcat').forEach(c => c.addEventListener('change', toggleNetwork));
  document.getElementById('reset-filters').addEventListener('click', resetFilters);
  prefControls.forEach(el => el.addEventListener('change', savePrefs));
  document.getElementById('lines').addEventListener('input', savePrefs);
  map.on('moveend', () => { clearTimeout(moveTimer); moveTimer = setTimeout(schedule, 400); });
  map.on('zoomend', drawStops);
  map.on('contextmenu', (e) => setManualPos(e.latlng.lat, e.latlng.lng));
  // An open popup re-renders its HTML on every animation frame (the marker
  // moves), so a press and its release rarely hit the same button node and
  // no `click` fires — react on pointerdown instead (plus keyboard clicks).
  // Capture phase, because Leaflet stops propagation at the popup container.
  const etaPress = (e) => {
    const btn = e.target.closest('.eta-btn');
    if (!btn || (e.type === 'click' && e.detail !== 0)) return;
    e.preventDefault();
    watchEta(btn.dataset.jid);
  };
  document.getElementById('map').addEventListener('pointerdown', etaPress, true);
  document.getElementById('map').addEventListener('click', etaPress, true);
  document.getElementById('eta-close').addEventListener('click', stopEta);
  restoreManualPos();
  initControlsCollapse();
  initControlsGap();
  initPrefetchInfoToggle();
  initAlertCollapse();

  loadPrefs();
  if (deepLinkLine) {
    // Overrides whatever loadPrefs() just restored, for this load only —
    // deliberately not saved via savePrefs(), so a dashboard click-through
    // never becomes the new persisted filter default.
    document.getElementById('lines').value = deepLinkLine;
  }
  schedule();
  toggleAlerts();
  toggleNetwork();
  toggleStops();
  pollWhileVisible(refreshAlerts, ALERT_POLL_MS);
  pollWhileVisible(refreshNetwork, NETWORK_POLL_MS);
  requestAnimationFrame(animate);
}

init();
</script>
</body>
</html>
