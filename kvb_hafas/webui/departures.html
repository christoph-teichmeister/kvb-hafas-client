<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KVB Abfahrten</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="app-header">
  <a class="brand" href="index.html"><span class="dot"></span>KVB Live <small style="font-weight:400;opacity:.6" title="Inoffizielles Projekt, nicht verbunden mit der Kölner Verkehrs-Betriebe AG">inoffiziell</small></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="map.html">Map</a>
    <a href="departures.html" class="active">Abfahrten</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>
</header>
<main>
  <h1>Abfahrten</h1>

  <details id="stopSearch">
    <summary>Haltestelle suchen</summary>
    <div class="search">
      <label for="query" class="sr-only">Haltestellenname</label>
      <input type="search" id="query" placeholder="z.B. Neumarkt" autocomplete="off">
      <button id="searchBtn">Suchen</button>
    </div>
    <button type="button" id="nearMeBtn" class="btn-outline btn-block">📍 Haltestellen in meiner Nähe</button>
    <ul class="stops" id="results" aria-live="polite"></ul>
  </details>

  <div class="sr-only" id="boardsAnnouncer" aria-live="polite" aria-atomic="true"></div>
  <div class="led-strip" id="boardsDate"></div>
  <div id="boards" class="stop-boards" role="region">
    <div class="stop-board-empty" id="boardsEmpty">Noch keine Haltestelle — oben suchen und favorisieren.</div>
  </div>
</main>
<script src="shared.js"></script>
<script>
const FAV_KEY = 'kvb-departures-favorites';
const FAV_NAMES_KEY = 'kvb-departures-favorite-names';
const WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
let cfg = { favorite_stop_ids: [] };
let alertsCacheTimer = null;

function loadLocalFavs() {
  try {
    const list = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
    return Array.isArray(list) ? list.filter(id => typeof id === 'string') : [];
  } catch { return []; }
}
function saveLocalFavs(list) {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); } catch { /* private mode */ }
}
function loadFavNames() {
  try {
    const names = JSON.parse(localStorage.getItem(FAV_NAMES_KEY) || '{}');
    return names && typeof names === 'object' && !Array.isArray(names) ? names : {};
  } catch { return {}; }
}
function saveFavName(id, name) {
  const names = loadFavNames();
  names[id] = name;
  try { localStorage.setItem(FAV_NAMES_KEY, JSON.stringify(names)); } catch { /* private mode */ }
}

function isConfigFav(id) {
  return (cfg.favorite_stop_ids || []).includes(id);
}
function isLocalFav(id) {
  return loadLocalFavs().includes(id);
}

// --- Multi-stop board grid --------------------------------------------
// Each favorite (and each stop a user is previewing from search) is its
// own live card. No click-to-select step: favorites simply appear.

const boards = new Map(); // stopId -> { name, departures, refreshPoll, countdownPoll, el }

function fmtTime(hafas) {
  const t = parseHafasTime(hafas);
  if (!t) return '—';
  return `${String(t.hour % 24).padStart(2, '0')}:${String(t.minute).padStart(2, '0')}`;
}

function headClock() {
  const now = berlinNow();
  return `${String(now.hour).padStart(2, '0')}:${String(now.minute).padStart(2, '0')}`;
}

function headDate() {
  const now = berlinNow();
  const dd = String(now.day).padStart(2, '0');
  const mm = String(now.month).padStart(2, '0');
  return `${WEEKDAYS[now.weekday]} ${dd}.${mm}.${now.year}`;
}

function groupByPlatform(deps) {
  const groups = new Map();
  for (const d of deps) {
    const key = d.platform ? String(d.platform) : '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(d);
  }
  return [...groups.entries()].sort(([a], [b]) => {
    if (a === '') return 1;
    if (b === '') return -1;
    return a.localeCompare(b, 'de', { numeric: true }); // "Steig 2" < "Steig 10"
  });
}

// Real dPlatf values are bare ("2", "A"); the mast fallback already reads
// "Steig N" (see kvb_hafas.parsing._mast_steig) — don't prefix it twice.
// No platform at all -> no label; the head then only carries the clock.
function platformLabel(platform) {
  if (!platform) return '';
  platform = String(platform);
  return /^steig\b/i.test(platform) ? platform : `Steig ${platform}`;
}

// Departures that are already gone (in Cologne time) are dropped; the 15s
// re-render lets them vanish between two 30s refetches. Unparseable times
// stay visible rather than silently disappearing.
function upcoming(deps, date = new Date()) {
  return deps.filter(d => {
    const eta = minutesUntil(d.realtime || d.planned, date);
    return eta === null || eta >= 0;
  });
}

function updateEmptyState() {
  document.getElementById('boardsEmpty').style.display = boards.size ? 'none' : '';
}

function favIcon(id) {
  if (isConfigFav(id)) return { icon: '🔒', active: true, title: 'Fest über App-Konfiguration favorisiert (favorite_stop_ids)' };
  if (isLocalFav(id)) return { icon: '★', active: true, title: 'Favorit entfernen (nur in diesem Browser gespeichert)' };
  return { icon: '☆', active: false, title: 'Als Favorit merken' };
}

function renderBoardHead(board) {
  const fav = favIcon(board.id);
  const locked = isConfigFav(board.id);
  const closeBtn = fav.active ? '' : `<button type="button" class="board-close" title="Entfernen" aria-label="Board entfernen">✕</button>`;
  board.el.querySelector('.stop-board-head').innerHTML = `
    <span class="stop-board-name">${esc(board.name)}</span>
    <div class="stop-board-actions">
      <button type="button" class="fav-toggle${fav.active ? ' active' : ''}" ${locked ? 'disabled' : ''} title="${esc(fav.title)}" aria-label="${esc(fav.title)}" aria-pressed="${fav.active}">${fav.icon}</button>
      ${closeBtn}
    </div>`;
}

function renderBoardRows(board) {
  const container = board.el.querySelector('.board-body');
  const deps = upcoming(board.departures);
  if (!deps.length) {
    container.innerHTML = '<div class="led-board"><div class="led-empty">keine Abfahrten</div></div>';
    return;
  }
  container.innerHTML = groupByPlatform(deps).map(([platform, group]) => {
    const rows = group.map(d => {
      const eta = minutesUntil(d.realtime || d.planned);
      const delayed = !d.cancelled && typeof d.delay_minutes === 'number' && d.delay_minutes > 0;
      const etaText = d.cancelled ? 'Entfällt'
        : delayed ? `${esc(fmtTime(d.realtime))}<span class="delay-tag">+${esc(d.delay_minutes)}</span>`
        : eta === null ? '—' : eta === 0 ? 'Sofort' : `${eta} Min`;
      return `<div class="led-row${d.cancelled ? ' cancelled' : ''}">
        <span class="led-num">${esc(d.line)}</span>
        <span class="led-dest">${esc(d.direction)}</span>
        <span class="led-eta">${etaText}</span>
      </div>`;
    }).join('');
    const label = platformLabel(platform);
    return `<div class="led-board">
      <div class="led-head"><span>${esc(label)}</span><span class="led-clock">${headClock()}</span></div>
      ${rows}
    </div>`;
  }).join('');
}

function announceBoardUpdate(board) {
  // Fires only on the 30s data refetch, not the 15s cosmetic countdown
  // re-render — a live region on a ticking countdown would otherwise
  // re-announce every tick.
  const announcer = document.getElementById('boardsAnnouncer');
  const deps = upcoming(board.departures);
  if (!deps.length) {
    announcer.textContent = `${board.name}: keine Abfahrten`;
    return;
  }
  const next = deps[0];
  const eta = minutesUntil(next.realtime || next.planned);
  const etaText = next.cancelled ? 'entfällt' : eta === null ? '' : eta === 0 ? 'sofort' : `in ${eta} Minuten`;
  announcer.textContent = `${board.name}: ${deps.length} Abfahrten, nächste Linie ${next.line} ${etaText}`;
}

async function refreshBoard(board) {
  try {
    const data = await fetchJson(`api/departures?stop_id=${encodeURIComponent(board.id)}&max=15`);
    if (!boards.has(board.id)) return; // removed while the request was in flight
    board.departures = Array.isArray(data.departures) ? data.departures : [];
    renderBoardRows(board);
    announceBoardUpdate(board);
  } catch (err) {
    board.el.querySelector('.board-body').innerHTML =
      `<div class="err">${esc(friendlyError(err))} <button type="button" class="retry" data-retry-board="${esc(board.id)}">Erneut versuchen</button></div>`;
  }
}

function addBoard(id, name) {
  let board = boards.get(id);
  if (board) {
    board.name = name;
    renderBoardHead(board);
    board.el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return board;
  }
  const el = document.createElement('div');
  el.className = 'stop-board';
  el.dataset.stopId = id;
  el.innerHTML = `
    <div class="stop-board-head"></div>
    <div class="board-body board-group"><div class="skeleton" style="height:110px;background:#050505"></div></div>
    <div class="led-board board-ticker" style="display:none"><div class="led-ticker"></div></div>`;
  document.getElementById('boards').appendChild(el);

  board = { id, name, departures: [], refreshPoll: null, countdownPoll: null, el };
  boards.set(id, board);
  renderBoardHead(board);
  updateEmptyState();

  refreshBoard(board);
  renderBoardTicker(board);
  board.refreshPoll = pollWhileVisible(() => refreshBoard(board), 30000);
  board.countdownPoll = pollWhileVisible(() => renderBoardRows(board), 15000);
  return board;
}

function removeBoard(id) {
  const board = boards.get(id);
  if (!board) return;
  board.refreshPoll.stop();
  board.countdownPoll.stop();
  board.el.remove();
  boards.delete(id);
  updateEmptyState();
}

function toggleBoardFavorite(id, name) {
  if (isConfigFav(id)) return; // fest über App-Konfiguration, nicht umschaltbar
  const local = new Set(loadLocalFavs());
  if (local.has(id)) local.delete(id); else { local.add(id); saveFavName(id, name); }
  saveLocalFavs([...local]);
  const board = boards.get(id);
  if (board) renderBoardHead(board);
  renderResultsCache();
}

// --- Search --------------------------------------------------------------

let lastResults = [];

function renderResultsCache() {
  renderStopList(document.getElementById('results'), lastResults);
}

function renderStopList(container, stops) {
  container.innerHTML = '';
  for (const s of stops) {
    const li = document.createElement('li');
    const group = document.createElement('button');
    group.type = 'button';
    group.className = 'stop-label-group stop-open';
    group.addEventListener('click', () => addBoard(s.ext_id, s.name));
    const label = document.createElement('span');
    label.textContent = s.name;
    label.title = `ext_id: ${s.ext_id} (für die favorite_stop_ids-Option)`;
    group.appendChild(label);
    if (typeof s.distance === 'number') {
      const dist = document.createElement('span');
      dist.className = 'stop-distance';
      dist.textContent = s.distance < 1000 ? `${Math.round(s.distance)} m` : `${(s.distance / 1000).toFixed(1)} km`;
      group.appendChild(dist);
    }
    li.appendChild(group);
    const fav = favIcon(s.ext_id);
    const star = document.createElement('button');
    star.type = 'button';
    star.className = 'fav' + (fav.active ? ' active' : '');
    star.textContent = fav.icon;
    star.title = fav.title;
    star.setAttribute('aria-label', `${s.name}: ${fav.title}`);
    star.setAttribute('aria-pressed', String(fav.active));
    if (isConfigFav(s.ext_id)) {
      star.disabled = true;
    } else {
      star.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleBoardFavorite(s.ext_id, s.name);
        if (!boards.has(s.ext_id) && isLocalFav(s.ext_id)) addBoard(s.ext_id, s.name);
      });
    }
    li.appendChild(star);
    container.appendChild(li);
  }
}

// --- "In meiner Nähe" — reuses /api/stops (the same stop list map.html
// draws markers from) plus browser geolocation, no new backend endpoint.

let allStopsCache = null;

async function loadAllStops() {
  if (allStopsCache) return allStopsCache;
  try {
    const data = await fetchJson('api/stops');
    allStopsCache = Array.isArray(data.stops) ? data.stops : [];
  } catch (err) {
    allStopsCache = [];
  }
  return allStopsCache;
}

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function findNearbyStops() {
  const results = document.getElementById('results');
  if (!navigator.geolocation) {
    results.innerHTML = '<li class="err">Standortbestimmung wird von diesem Browser nicht unterstützt.</li>';
    return;
  }
  results.innerHTML = '<li class="empty">Standort wird ermittelt …</li>';
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      const stops = await loadAllStops();
      if (!stops.length) {
        results.innerHTML = '<li class="empty">Keine Haltestellendaten verfügbar.</li>';
        return;
      }
      lastResults = stops
        .map((s) => ({ ...s, ext_id: s.id, distance: haversineMeters(latitude, longitude, s.lat, s.lon) }))
        .sort((a, b) => a.distance - b.distance)
        .slice(0, 8);
      renderResultsCache();
    },
    (err) => {
      const messages = {
        1: 'Standortzugriff wurde verweigert.',
        2: 'Standort konnte nicht ermittelt werden.',
        3: 'Zeitüberschreitung bei der Standortbestimmung.',
      };
      results.innerHTML = `<li class="err">${esc(messages[err.code] || 'Standort konnte nicht ermittelt werden.')}</li>`;
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

async function search() {
  const q = document.getElementById('query').value.trim();
  const results = document.getElementById('results');
  if (!q) { results.innerHTML = ''; return; }
  results.innerHTML = '<li class="empty">suche …</li>';
  try {
    const data = await fetchJson(`api/stops/search?q=${encodeURIComponent(q)}`);
    lastResults = Array.isArray(data.stops) ? data.stops : [];
    renderResultsCache();
    if (!lastResults.length) results.innerHTML = '<li class="empty">keine Treffer</li>';
  } catch (err) {
    results.innerHTML = `<li class="err">${esc(friendlyError(err))} <button type="button" class="retry" data-retry="search">Erneut versuchen</button></li>`;
  }
}

// --- Service alerts, filtered per stop and shown inside each board -------
// The HAFAS alert feed only names affected stops (by full stop name), not
// line ids — a mention of "Linie 1" only ever appears in the free-text
// message, so filtering can only match on the board's own stop name.

let allAlerts = [];

function renderBoardTicker(board) {
  const wrap = board.el.querySelector('.board-ticker');
  const box = wrap.querySelector('.led-ticker');
  const relevant = allAlerts.filter(a => Array.isArray(a.stops) && a.stops.includes(board.name));
  const text = relevant.map(a => a.text).filter(t => typeof t === 'string' && t).join('   •   ');
  if (!text) { wrap.style.display = 'none'; return; }
  const duration = Math.max(16, text.length * 0.25);
  wrap.style.display = '';
  box.innerHTML = `<span class="track" style="animation-duration:${duration.toFixed(1)}s">${esc(text)}</span>`;
}

async function refreshAlertsCache() {
  try {
    const data = await fetchJson('api/alerts');
    allAlerts = Array.isArray(data.alerts) ? data.alerts : [];
  } catch (err) { /* keep previous cache, retry next tick */ }
  for (const board of boards.values()) renderBoardTicker(board);
}

async function resolveMissingFavNames(ids) {
  const names = loadFavNames();
  const missing = ids.filter((id) => !names[id]);
  if (!missing.length) return names;
  await Promise.all(missing.map(async (id) => {
    try {
      const data = await fetchJson(`api/stops/details?ext_id=${encodeURIComponent(id)}`);
      if (typeof data.name === 'string' && data.name) { names[id] = data.name; saveFavName(id, data.name); }
    } catch (err) { /* keep showing the id */ }
  }));
  return names;
}

async function init() {
  try {
    cfg = await fetchJson('api/config');
  } catch (err) { /* defaults */ }

  document.getElementById('boardsDate').textContent = headDate();
  pollWhileVisible(() => { document.getElementById('boardsDate').textContent = headDate(); }, 60000);

  const favIds = [...new Set([...(cfg.favorite_stop_ids || []), ...loadLocalFavs()])];
  document.getElementById('stopSearch').open = favIds.length === 0;

  if (favIds.length) {
    const names = await resolveMissingFavNames(favIds);
    for (const id of favIds) addBoard(id, names[id] || id);
  } else {
    updateEmptyState();
  }

  refreshAlertsCache();
  alertsCacheTimer = pollWhileVisible(refreshAlertsCache, 300000);

  document.getElementById('searchBtn').addEventListener('click', search);
  document.getElementById('nearMeBtn').addEventListener('click', findNearbyStops);
  document.getElementById('query').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });

  document.getElementById('boards').addEventListener('click', (e) => {
    const favBtn = e.target.closest('.fav-toggle');
    const closeBtn = e.target.closest('.board-close');
    const retryBtn = e.target.closest('[data-retry-board]');
    const card = e.target.closest('.stop-board');
    if (!card) return;
    const id = card.dataset.stopId;
    const board = boards.get(id);
    if (favBtn) toggleBoardFavorite(id, board.name);
    else if (closeBtn) removeBoard(id);
    else if (retryBtn) refreshBoard(board);
  });

  document.body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-retry]');
    if (!btn) return;
    if (btn.dataset.retry === 'search') search();
  });
}

init();
</script>
</body>
</html>
