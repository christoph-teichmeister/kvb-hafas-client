<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KVB Dashboard</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="app-header">
  <a class="brand" href="index.html"><span class="dot"></span>KVB Live</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="map.html">Map</a>
    <a href="departures.html">Abfahrten</a>
    <a href="dashboard.html" class="active">Dashboard</a>
  </nav>
</header>
<main>
  <h1>Dashboard</h1>
  <p class="subtitle"><span class="live-dot" id="liveDot" style="display:none"></span> <span id="liveLabel">Live</span></p>

  <h2>Live</h2>
  <div class="stat-grid" id="liveTiles" role="region" aria-live="polite">
    <div class="stat-row"><div class="skeleton stat-skeleton"></div></div>
    <div class="stat-row"><div class="skeleton stat-skeleton"></div></div>
    <div class="stat-row"><div class="skeleton stat-skeleton"></div></div>
  </div>

  <h2>Verspätungen (historisch)</h2>
  <div class="stat-grid" id="delayTiles" role="region" aria-live="polite"></div>

  <h2>Pünktlichkeit je Linie</h2>
  <div class="window-toggle" role="group" aria-label="Zeitraum">
    <button type="button" data-window="7d" class="active">7 Tage</button>
    <button type="button" data-window="24h">24h</button>
    <button type="button" data-window="1h">1h</button>
  </div>
  <div id="punctualityChart"></div>
  <div class="note" id="historyNote"></div>
</main>
<script>
let refreshSeconds = 15;

// Canonical KVB Stadtbahn line numbers, in fixed legend/color order so a
// line's color stays stable across renders even when it has no data some days.
const TRAM_LINES = ['1', '3', '4', '5', '7', '9', '12', '13', '15', '16', '17', '18'];
const LINE_COLORS = TRAM_LINES.map((_, i) => `hsl(${(i * 360 / TRAM_LINES.length).toFixed(0)}, 65%, 45%)`);

function lineColor(line) {
  const i = TRAM_LINES.indexOf(line);
  return i >= 0 ? LINE_COLORS[i] : 'hsl(0, 0%, 60%)';
}

function friendlyError(err) {
  if (err instanceof TypeError) return 'Netzwerkfehler — ist der Server erreichbar?';
  return err.message || 'Unbekannter Fehler';
}

function statRow(value, label, trend, textValue) {
  const t = trend ? `<span class="trend ${trend > 0 ? 'up' : 'down'}">${trend > 0 ? '▲' : '▼'}${Math.abs(trend)}</span>` : '';
  const cls = textValue ? 'value text' : 'value';
  return `<div class="stat-row"><span class="label">${label}</span><span class="${cls}">${value}${t}</span></div>`;
}

function statRowSub(value, label, sub) {
  const subHtml = sub ? `<span class="sub">${sub}</span>` : '';
  return `<div class="stat-row"><span class="label">${label}${subHtml}</span><span class="value">${value}</span></div>`;
}

function maxDelayTile(d) {
  const veh = d.max_current_delay_vehicle;
  const sub = veh ? `Linie ${veh.line} → ${veh.direction || '—'}` : '';
  const inner = statRowSub(d.max_current_delay_minutes ?? '—', 'max. Verspätung (Min)', sub);
  if (!veh) return inner;
  const href = `map.html?line=${encodeURIComponent(veh.line)}&jid=${encodeURIComponent(veh.jid)}`;
  return `<a class="stat-row-link" href="${href}" title="Auf der Karte anzeigen">${inner}</a>`;
}

function historicalMaxDelayTile(d) {
  const detail = d.max_delay_detail;
  const when = detail
    ? new Date(detail.observed_at * 1000).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
    : '';
  const sub = detail ? `Linie ${detail.line} → ${detail.direction || '—'} · ${when}` : '';
  return statRowSub(d.max_delay_minutes ?? '—', 'max. beobachtete Verspätung (Min)', sub);
}

let prevDelayed = null;

async function refreshLive() {
  const box = document.getElementById('liveTiles');
  const dot = document.getElementById('liveDot');
  const label = document.getElementById('liveLabel');
  try {
    const res = await fetch('api/stats/live?mode=tram');
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.statusText);
    dot.style.display = 'inline-block';
    label.textContent = `Live — aktualisiert alle ${refreshSeconds}s`;
    const trend = prevDelayed === null ? null : d.delayed_vehicle_count - prevDelayed;
    prevDelayed = d.delayed_vehicle_count;
    box.innerHTML = [
      statRow(d.busiest_line ? `Linie ${d.busiest_line} · ${d.busiest_line_count} Fahrzeuge` : '—', 'meist befahrene Linie', null, true),
      maxDelayTile(d),
      statRow(d.delayed_vehicle_count, `verspätet ≥${d.delayed_threshold_minutes}min`, trend),
    ].join('');
  } catch (err) {
    dot.style.display = 'none';
    label.textContent = '';
    box.innerHTML = `<div class="err">${friendlyError(err)} <button type="button" class="retry" data-retry="live">Erneut versuchen</button></div>`;
  }
}

async function refreshDelays() {
  const box = document.getElementById('delayTiles');
  const note = document.getElementById('historyNote');
  try {
    const res = await fetch('api/stats/delays');
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.statusText);
    if (d.error === 'history disabled') {
      note.textContent = 'Verlauf ist deaktiviert (history_enabled=false) — keine historischen Statistiken verfügbar.';
      box.innerHTML = '';
      document.getElementById('punctualityChart').innerHTML = '';
      return;
    }
    note.textContent = '';
    box.innerHTML = historicalMaxDelayTile(d);
  } catch (err) {
    box.innerHTML = `<div class="err">${friendlyError(err)} <button type="button" class="retry" data-retry="delays">Erneut versuchen</button></div>`;
  }
}

let punctualityWindow = '7d';
const WINDOW_LABELS = { '7d': 'über 7 Tage', '24h': 'über 24 Stunden', '1h': 'über die letzte Stunde' };

function fmtBucketLabel(ts, window) {
  const d = new Date(ts * 1000);
  if (window === '7d') {
    return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;
  }
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function renderPunctualityChart(data) {
  const container = document.getElementById('punctualityChart');
  const buckets = data.buckets || [];
  const linesData = data.lines || {};
  const activeLines = TRAM_LINES.filter(l => linesData[l] && linesData[l].some(v => v !== null && v !== undefined));

  if (!buckets.length || !activeLines.length) {
    container.innerHTML = '<div class="empty">noch nicht genug Verlaufsdaten</div>';
    return;
  }

  const W = 640, H = 220, padL = 34, padR = 10, padT = 10, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const x = i => padL + (buckets.length === 1 ? 0 : (i / (buckets.length - 1)) * plotW);
  const y = v => padT + (1 - v) * plotH;
  const labelEvery = buckets.length > 15 ? 3 : 1;

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pünktlichkeit je Linie ${WINDOW_LABELS[punctualityWindow]}" preserveAspectRatio="xMidYMid meet">`;
  [0, 25, 50, 75, 100].forEach(pct => {
    const gy = y(pct / 100);
    svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" style="stroke:var(--border)" stroke-width="1"/>`;
    svg += `<text x="${padL - 6}" y="${gy + 3}" text-anchor="end" font-size="9" style="fill:var(--text-tertiary)">${pct}%</text>`;
  });
  buckets.forEach((b, i) => {
    if (i % labelEvery !== 0 && i !== buckets.length - 1) return;
    svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="9" style="fill:var(--text-tertiary)">${fmtBucketLabel(b, punctualityWindow)}</text>`;
  });

  for (const line of activeLines) {
    const color = lineColor(line);
    const values = linesData[line];
    const runs = [];
    let current = [];
    values.forEach((v, i) => {
      if (v === null || v === undefined) {
        if (current.length) runs.push(current);
        current = [];
      } else {
        current.push([i, v]);
      }
    });
    if (current.length) runs.push(current);

    for (const run of runs) {
      const pts = run.map(([i, v]) => `${x(i)},${y(v)}`).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
      for (const [i, v] of run) {
        svg += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${color}"><title>Linie ${line}: ${(v * 100).toFixed(0)}% um ${fmtBucketLabel(buckets[i], punctualityWindow)}</title></circle>`;
      }
    }
  }
  svg += '</svg>';

  const legend = `<ul class="chart-legend">${activeLines.map(l =>
    `<li><span class="swatch" style="background:${lineColor(l)}"></span>Linie ${l}</li>`
  ).join('')}</ul>`;

  container.innerHTML = svg + legend;
}

async function refreshPunctuality() {
  const chart = document.getElementById('punctualityChart');
  try {
    const res = await fetch(`api/stats/punctuality-trend?window=${punctualityWindow}`);
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.statusText);
    if (d.error === 'history disabled') {
      chart.innerHTML = ''; // historyNote is already set by refreshDelays()
      return;
    }
    renderPunctualityChart(d);
  } catch (err) {
    chart.innerHTML = `<div class="err">${friendlyError(err)} <button type="button" class="retry" data-retry="punctuality">Erneut versuchen</button></div>`;
  }
}

function refreshAll() {
  refreshLive();
  refreshDelays();
  refreshPunctuality();
}

async function init() {
  try {
    const res = await fetch('api/config');
    if (res.ok) {
      const cfg = await res.json();
      refreshSeconds = cfg.dashboard_refresh_seconds || 15;
    }
  } catch (err) { /* defaults */ }
  refreshAll();
  setInterval(refreshAll, refreshSeconds * 1000);
  document.body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-retry]');
    if (!btn) return;
    if (btn.dataset.retry === 'live') refreshLive();
    else if (btn.dataset.retry === 'delays') refreshDelays();
    else if (btn.dataset.retry === 'punctuality') refreshPunctuality();
  });
  document.querySelectorAll('.window-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.window === punctualityWindow) return;
      punctualityWindow = btn.dataset.window;
      document.querySelectorAll('.window-toggle button').forEach(b => b.classList.toggle('active', b === btn));
      refreshPunctuality();
    });
  });
}

init();
</script>
</body>
</html>
