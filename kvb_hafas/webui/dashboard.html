<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KVB Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="app-header">
  <a class="brand" href="index.html"><span class="dot"></span>KVB Live</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="map.html">Map</a>
    <a href="departures.html">Abfahrten</a>
    <a href="dashboard.html" class="active">Dashboard</a>
  </nav>
</header>
<main>
  <h1>Dashboard</h1>
  <p class="subtitle"><span class="live-dot" id="liveDot" style="display:none"></span> <span id="liveLabel">Live</span></p>
  <div class="refresh-bar"><div class="refresh-bar-fill" id="refreshBarFill"></div></div>

  <h2>Live</h2>
  <div class="stat-grid" id="liveTiles" role="region" aria-live="polite">
    <div class="stat-row"><div class="skeleton stat-skeleton"></div></div>
    <div class="stat-row"><div class="skeleton stat-skeleton"></div></div>
    <div class="stat-row"><div class="skeleton stat-skeleton"></div></div>
  </div>

  <h2>Verspätungen (historisch)</h2>
  <div class="stat-grid" id="delayTiles" role="region" aria-live="polite"></div>

  <h2>Pünktlichkeit je Linie</h2>
  <div class="window-toggle" role="group" aria-label="Zeitraum" id="punctualityWindow">
    <button type="button" data-value="7d" class="active">7 Tage</button>
    <button type="button" data-value="24h">24h</button>
    <button type="button" data-value="1h">1h</button>
  </div>
  <div id="punctualityChart"></div>
  <div class="line-filter" id="lineFilter" hidden>
    <ul class="chart-legend" id="chartLegend" role="group" aria-label="Linien ein-/ausblenden"></ul>
    <div class="line-filter-actions">
      <button type="button" data-lines="all">Alle</button>
      <button type="button" data-lines="none">Keine</button>
      <span class="hint">Klick blendet Linie ein/aus, Doppelklick zeigt nur diese Linie · Klick auf die Kurve öffnet die Linie auf der Karte</span>
    </div>
  </div>
  <p class="chart-caption" id="punctualityCaption"></p>

  <h2>Pünktlichkeit nach Tageszeit</h2>
  <div class="toggle-row">
    <div class="window-toggle" role="group" aria-label="Zeitraum" id="heatmapWindow">
      <button type="button" data-value="28d" class="active">28 Tage</button>
      <button type="button" data-value="7d">7 Tage</button>
    </div>
    <div class="window-toggle" role="group" aria-label="Wochentage" id="heatmapDays">
      <button type="button" data-value="all" class="active">Alle Tage</button>
      <button type="button" data-value="weekday">Mo–Fr</button>
      <button type="button" data-value="sat">Sa</button>
      <button type="button" data-value="sun">So</button>
    </div>
  </div>
  <div id="hourHeatmap"></div>
  <p class="chart-caption" id="heatmapCaption"></p>
  <div class="note" id="historyNote"></div>
</main>
<script>
let refreshSeconds = 15;

// Canonical KVB Stadtbahn line numbers, in fixed legend/color order so a
// line's color stays stable across renders even when it has no data some days.
const TRAM_LINES = ['1', '3', '4', '5', '7', '9', '12', '13', '15', '16', '17', '18'];
const LINE_COLORS = TRAM_LINES.map((_, i) => `hsl(${(i * 360 / TRAM_LINES.length).toFixed(0)}, 65%, 45%)`);

function lineColor(line) {
  const i = TRAM_LINES.indexOf(line);
  return i >= 0 ? LINE_COLORS[i] : 'hsl(0, 0%, 60%)';
}

function friendlyError(err) {
  if (err instanceof TypeError) return 'Netzwerkfehler — ist der Server erreichbar?';
  return err.message || 'Unbekannter Fehler';
}

function statRow(value, label, trend, textValue) {
  const t = trend ? `<span class="trend ${trend > 0 ? 'up' : 'down'}">${trend > 0 ? '▲' : '▼'}${Math.abs(trend)}</span>` : '';
  const cls = textValue ? 'value text' : 'value';
  return `<div class="stat-row"><span class="label">${label}</span><span class="${cls}">${value}${t}</span></div>`;
}

function statRowSub(value, label, sub) {
  const subHtml = sub ? `<span class="sub">${sub}</span>` : '';
  return `<div class="stat-row"><span class="label">${label}${subHtml}</span><span class="value">${value}</span></div>`;
}

function maxDelayTile(d) {
  const veh = d.max_current_delay_vehicle;
  const sub = veh ? `Linie ${veh.line} → ${veh.direction || '—'}` : '';
  const inner = statRowSub(d.max_current_delay_minutes ?? '—', 'max. Verspätung (Min)', sub);
  if (!veh) return inner;
  const href = `map.html?line=${encodeURIComponent(veh.line)}&jid=${encodeURIComponent(veh.jid)}`;
  return `<a class="stat-row-link" href="${href}" title="Auf der Karte anzeigen">${inner}</a>`;
}

function historicalMaxDelayTile(d) {
  const detail = d.max_delay_detail;
  const when = detail
    ? new Date(detail.observed_at * 1000).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
    : '';
  const sub = detail ? `Linie ${detail.line} → ${detail.direction || '—'} · ${when}` : '';
  return statRowSub(d.max_delay_minutes ?? '—', 'max. beobachtete Verspätung (Min)', sub);
}

let prevDelayed = null;

async function refreshLive() {
  const box = document.getElementById('liveTiles');
  const dot = document.getElementById('liveDot');
  const label = document.getElementById('liveLabel');
  try {
    const res = await fetch('api/stats/live?mode=tram');
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.statusText);
    dot.style.display = 'inline-block';
    label.textContent = `Live - aktualisiert alle ${refreshSeconds}s`;
    const trend = prevDelayed === null ? null : d.delayed_vehicle_count - prevDelayed;
    prevDelayed = d.delayed_vehicle_count;
    box.innerHTML = [
      statRow(d.busiest_line ? `Linie ${d.busiest_line} · ${d.busiest_line_count} Fahrzeuge` : '—', 'meist befahrene Linie', null, true),
      maxDelayTile(d),
      statRow(d.delayed_vehicle_count, `verspätet ≥${d.delayed_threshold_minutes}min`, trend),
    ].join('');
  } catch (err) {
    dot.style.display = 'none';
    label.textContent = '';
    box.innerHTML = `<div class="err">${friendlyError(err)} <button type="button" class="retry" data-retry="live">Erneut versuchen</button></div>`;
  }
}

async function refreshDelays() {
  const box = document.getElementById('delayTiles');
  const note = document.getElementById('historyNote');
  try {
    const res = await fetch('api/stats/delays');
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.statusText);
    if (d.error === 'history disabled') {
      note.textContent = 'Verlauf ist deaktiviert (history_enabled=false) — keine historischen Statistiken verfügbar.';
      box.innerHTML = '';
      document.getElementById('punctualityChart').innerHTML = '';
      document.getElementById('lineFilter').hidden = true;
      return;
    }
    note.textContent = '';
    box.innerHTML = historicalMaxDelayTile(d);
  } catch (err) {
    box.innerHTML = `<div class="err">${friendlyError(err)} <button type="button" class="retry" data-retry="delays">Erneut versuchen</button></div>`;
  }
}

// Buckets backed by fewer observations (vehicle samples, one per vehicle per
// sampler tick) than this are drawn faded: a rate from 3 samples is noise.
const MIN_SAMPLES = 20;

let punctualityWindow = '7d';
const WINDOW_LABELS = { '7d': 'über 7 Tage', '24h': 'über 24 Stunden', '1h': 'über die letzte Stunde' };

function fmtBucketLabel(ts, window) {
  const d = new Date(ts * 1000);
  if (window === '7d') {
    return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;
  }
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// Lines the user deselected in the legend; persisted per browser so the
// selection survives the periodic refresh and page reloads.
const HIDDEN_LINES_KEY = 'kvb-dashboard-hidden-lines';
let hiddenLines = linesFromUrl() || loadHiddenLines();
let lastPunctuality = null;

function loadHiddenLines() {
  try {
    const stored = JSON.parse(localStorage.getItem(HIDDEN_LINES_KEY) || '[]');
    return new Set(Array.isArray(stored) ? stored.filter(l => TRAM_LINES.includes(l)) : []);
  } catch (err) { return new Set(); }
}

function saveHiddenLines() {
  try { localStorage.setItem(HIDDEN_LINES_KEY, JSON.stringify([...hiddenLines])); } catch (err) { /* private mode */ }
}

// ?lines=13,18 shows only those lines — bookmarkable, linkable from HA.
// Unknown line numbers are ignored; a param with none left is ignored too.
function linesFromUrl() {
  const raw = new URLSearchParams(location.search).get('lines');
  if (raw === null) return null;
  const shown = raw.split(',').map(l => l.trim()).filter(l => TRAM_LINES.includes(l));
  if (!shown.length) return null;
  return new Set(TRAM_LINES.filter(l => !shown.includes(l)));
}

function syncLinesToUrl() {
  const params = new URLSearchParams(location.search);
  if (hiddenLines.size) params.set('lines', TRAM_LINES.filter(l => !hiddenLines.has(l)).join(','));
  else params.delete('lines');
  const qs = params.toString().replace(/%2C/g, ',');
  history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
}

function mapHref(line) {
  return `map.html?line=${encodeURIComponent(line)}`;
}

function pct(v) {
  return `${(v * 100).toFixed(0)} %`;
}

function renderPunctualityChart(data) {
  lastPunctuality = data;
  const container = document.getElementById('punctualityChart');
  const filter = document.getElementById('lineFilter');
  const buckets = data.buckets || [];
  const linesData = data.lines || {};
  const activeLines = TRAM_LINES.filter(l => linesData[l] && linesData[l].some(v => v !== null && v !== undefined));

  if (!buckets.length || !activeLines.length) {
    container.innerHTML = '<div class="empty">noch nicht genug Verlaufsdaten</div>';
    filter.hidden = true;
    document.getElementById('punctualityCaption').textContent = '';
    return;
  }

  const shownLines = activeLines.filter(l => !hiddenLines.has(l));

  const W = 640, H = 220, padL = 34, padR = 10, padT = 10, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const x = i => padL + (buckets.length === 1 ? 0 : (i / (buckets.length - 1)) * plotW);
  const y = v => padT + (1 - v) * plotH;
  const labelEvery = buckets.length > 15 ? 3 : 1;

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pünktlichkeit je Linie ${WINDOW_LABELS[punctualityWindow]}" preserveAspectRatio="xMidYMid meet">`;
  [0, 25, 50, 75, 100].forEach(pct => {
    const gy = y(pct / 100);
    svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" style="stroke:var(--border)" stroke-width="1"/>`;
    svg += `<text x="${padL - 6}" y="${gy + 3}" text-anchor="end" font-size="9" style="fill:var(--text-tertiary)">${pct}%</text>`;
  });
  buckets.forEach((b, i) => {
    if (i % labelEvery !== 0 && i !== buckets.length - 1) return;
    const anchor = i === buckets.length - 1 && buckets.length > 1 ? 'end' : i === 0 && buckets.length > 1 ? 'start' : 'middle';
    svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="${anchor}" font-size="9" style="fill:var(--text-tertiary)">${fmtBucketLabel(b, punctualityWindow)}</text>`;
  });

  const countsData = data.counts || {};
  for (const line of shownLines) {
    const color = lineColor(line);
    const values = linesData[line];
    const counts = countsData[line] || [];
    const runs = [];
    let current = [];
    values.forEach((v, i) => {
      if (v === null || v === undefined) {
        if (current.length) runs.push(current);
        current = [];
      } else {
        current.push([i, v]);
      }
    });
    if (current.length) runs.push(current);

    svg += `<a href="${mapHref(line)}" class="series" data-line="${line}"><title>Linie ${line} auf der Karte zeigen</title>`;
    for (const run of runs) {
      const pts = run.map(([i, v]) => `${x(i)},${y(v)}`).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
      for (const [i, v] of run) {
        const n = counts[i];
        const thin = n !== undefined && n < MIN_SAMPLES;
        const nLabel = n === undefined ? '' : ` · ${n} Beobachtungen${thin ? ' (wenig Daten)' : ''}`;
        const style = thin ? `style="fill:var(--surface)" stroke="${color}" stroke-width="1.5" class="thin"` : `fill="${color}"`;
        svg += `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" ${style}><title>Linie ${line}: ${pct(v)} pünktlich um ${fmtBucketLabel(buckets[i], punctualityWindow)}${nLabel}</title></circle>`;
      }
    }
    svg += '</a>';
  }
  if (!shownLines.length) {
    svg += `<text x="${padL + plotW / 2}" y="${padT + plotH / 2}" text-anchor="middle" font-size="11" style="fill:var(--text-tertiary)">keine Linie ausgewählt</text>`;
  }
  svg += '</svg>';

  container.innerHTML = svg;
  renderLegend(activeLines);
  filter.hidden = false;
  document.getElementById('punctualityCaption').textContent = lateCaption(data.late_from_minutes) +
    ` Hohle Punkte: weniger als ${MIN_SAMPLES} Beobachtungen.`;
}

function lateCaption(lateFrom) {
  return lateFrom ? `Pünktlich = weniger als ${lateFrom} Min. Verspätung.` : '';
}

// Rebuilds the legend only when the set of lines changes; otherwise just
// flips aria-pressed, so the buttons stay the same DOM nodes (needed for
// dblclick detection, and keeps keyboard focus across the periodic refresh).
function renderLegend(activeLines) {
  const legend = document.getElementById('chartLegend');
  const key = activeLines.join(',');
  if (legend.dataset.lines !== key) {
    legend.dataset.lines = key;
    legend.innerHTML = activeLines.map(l =>
      `<li><button type="button" data-line="${l}"><span class="swatch" style="background:${lineColor(l)}"></span>Linie ${l}</button></li>`
    ).join('');
  }
  legend.querySelectorAll('button[data-line]').forEach(btn => {
    btn.setAttribute('aria-pressed', String(!hiddenLines.has(btn.dataset.line)));
  });
}

function highlightLine(line) {
  const svg = document.querySelector('#punctualityChart svg');
  if (!svg) return;
  svg.classList.toggle('has-focus', !!line && !hiddenLines.has(line));
  svg.querySelectorAll('.series').forEach(g => g.classList.toggle('focused', g.dataset.line === line));
}

function setHiddenLines(next) {
  hiddenLines = next;
  saveHiddenLines();
  syncLinesToUrl();
  if (lastPunctuality) renderPunctualityChart(lastPunctuality);
  if (lastHeatmap) renderHeatmap(lastHeatmap);
}

function initLineFilter() {
  const filter = document.getElementById('lineFilter');
  const legend = document.getElementById('chartLegend');
  legend.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-line]');
    if (!btn) return;
    const next = new Set(hiddenLines);
    if (next.has(btn.dataset.line)) next.delete(btn.dataset.line); else next.add(btn.dataset.line);
    setHiddenLines(next);
  });
  // A double click fires two clicks first (net: unchanged), then isolates the line.
  legend.addEventListener('dblclick', (e) => {
    const btn = e.target.closest('button[data-line]');
    if (!btn) return;
    setHiddenLines(new Set(TRAM_LINES.filter(l => l !== btn.dataset.line)));
  });
  legend.addEventListener('mouseover', (e) => {
    const btn = e.target.closest('button[data-line]');
    highlightLine(btn ? btn.dataset.line : null);
  });
  legend.addEventListener('mouseleave', () => highlightLine(null));
  legend.addEventListener('focusin', (e) => {
    const btn = e.target.closest('button[data-line]');
    if (btn) highlightLine(btn.dataset.line);
  });
  legend.addEventListener('focusout', () => highlightLine(null));
  filter.querySelector('[data-lines="all"]').addEventListener('click', () => setHiddenLines(new Set()));
  filter.querySelector('[data-lines="none"]').addEventListener('click', () => setHiddenLines(new Set(TRAM_LINES)));
}

// Hour-of-day heatmap. The 28-day query is heavier than the others and the
// picture barely moves minute to minute, so it refreshes on its own slower
// clock (and immediately on toggle changes).
const HEATMAP_REFRESH_SECONDS = 300;
const DAY_LABELS = { all: 'alle Tage', weekday: 'Mo–Fr', sat: 'Samstag', sun: 'Sonntag' };
let heatmapWindow = '28d';
let heatmapDays = 'all';
let lastHeatmap = null;

function renderHeatmap(data) {
  lastHeatmap = data;
  const container = document.getElementById('hourHeatmap');
  const caption = document.getElementById('heatmapCaption');
  const linesData = data.lines || {};
  const countsData = data.counts || {};
  const withData = TRAM_LINES.filter(l => linesData[l] && linesData[l].some(v => v !== null && v !== undefined));
  const rows = withData.filter(l => !hiddenLines.has(l));

  if (!withData.length) {
    container.innerHTML = '<div class="empty">noch nicht genug Verlaufsdaten</div>';
    caption.textContent = '';
    return;
  }
  if (!rows.length) {
    container.innerHTML = '<div class="empty">keine Linie ausgewählt</div>';
    caption.textContent = '';
    return;
  }

  // Color encodes the late share (the "bad" direction gets the ink), scaled
  // to the worst reliable cell so a network that's 90 % punctual still shows
  // contrast. Thin cells don't set the scale — one late sample would flatten it.
  let maxLate = 0.1;
  for (const l of rows) {
    linesData[l].forEach((v, h) => {
      if (v !== null && (countsData[l]?.[h] ?? MIN_SAMPLES) >= MIN_SAMPLES) maxLate = Math.max(maxLate, 1 - v);
    });
  }

  const cellW = 24, cellH = 20, gap = 2, padL = 58, padT = 16;
  const W = padL + 24 * cellW, H = padT + rows.length * cellH;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pünktlichkeit je Linie nach Tageszeit, ${DAY_LABELS[heatmapDays]}" preserveAspectRatio="xMidYMid meet">`;
  svg += `<defs><pattern id="thinHatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" style="stroke:var(--text-tertiary)" stroke-width="1"/></pattern></defs>`;
  for (let h = 0; h < 24; h += 3) {
    svg += `<text x="${padL + h * cellW + cellW / 2}" y="${padT - 5}" text-anchor="middle" font-size="9" style="fill:var(--text-tertiary)">${String(h).padStart(2, '0')}</text>`;
  }
  rows.forEach((line, r) => {
    const cy = padT + r * cellH;
    svg += `<rect x="4" y="${cy + cellH / 2 - 4}" width="8" height="8" rx="2" fill="${lineColor(line)}"/>`;
    svg += `<text x="16" y="${cy + cellH / 2 + 3}" font-size="10" style="fill:var(--text-secondary)">Linie ${line}</text>`;
    svg += `<a href="${mapHref(line)}">`;
    linesData[line].forEach((v, h) => {
      const x = padL + h * cellW;
      const n = countsData[line]?.[h] ?? 0;
      const w = cellW - gap, hh = cellH - gap;
      if (v === null || v === undefined) {
        svg += `<rect x="${x}" y="${cy}" width="${w}" height="${hh}" rx="3" class="heat-empty"><title>Linie ${line}, ${String(h).padStart(2, '0')}–${String(h + 1).padStart(2, '0')} Uhr: keine Daten</title></rect>`;
        return;
      }
      const late = 1 - v;
      const alpha = (0.06 + 0.94 * Math.min(1, late / maxLate)).toFixed(3);
      const thin = n < MIN_SAMPLES;
      const title = `Linie ${line}, ${String(h).padStart(2, '0')}–${String(h + 1).padStart(2, '0')} Uhr: ${pct(v)} pünktlich · ${n} Beobachtungen${thin ? ' (wenig Daten)' : ''}`;
      svg += `<rect x="${x}" y="${cy}" width="${w}" height="${hh}" rx="3" class="heat-cell" fill-opacity="${alpha}"><title>${title}</title></rect>`;
      if (thin) svg += `<rect x="${x}" y="${cy}" width="${w}" height="${hh}" rx="3" fill="url(#thinHatch)" pointer-events="none"/>`;
    });
    svg += '</a>';
  });
  svg += '</svg>';

  const scale = `<div class="heat-scale" aria-hidden="true"><span>0 % verspätet</span><span class="heat-ramp"></span><span>≥ ${(maxLate * 100).toFixed(0)} % verspätet</span></div>`;
  container.innerHTML = svg + scale;
  caption.textContent = `${lateCaption(data.late_from_minutes)} Ortszeit, ${DAY_LABELS[heatmapDays]}, letzte ${heatmapWindow === '7d' ? '7' : '28'} Tage. ` +
    `Schraffiert: weniger als ${MIN_SAMPLES} Beobachtungen. Linienauswahl wie oben.`;
}

async function refreshHeatmap() {
  const container = document.getElementById('hourHeatmap');
  try {
    const res = await fetch(`api/stats/punctuality-by-hour?window=${heatmapWindow}&days=${heatmapDays}`);
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.statusText);
    if (d.error === 'history disabled') {
      container.innerHTML = '';
      document.getElementById('heatmapCaption').textContent = '';
      return;
    }
    renderHeatmap(d);
  } catch (err) {
    document.getElementById('heatmapCaption').textContent = '';
    container.innerHTML = `<div class="err">${friendlyError(err)} <button type="button" class="retry" data-retry="heatmap">Erneut versuchen</button></div>`;
  }
}

function initToggleGroup(id, onChange) {
  const group = document.getElementById(id);
  group.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-value]');
    if (!btn || btn.classList.contains('active')) return;
    group.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    onChange(btn.dataset.value);
  });
}

async function refreshPunctuality() {
  const chart = document.getElementById('punctualityChart');
  try {
    const res = await fetch(`api/stats/punctuality-trend?window=${punctualityWindow}`);
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.statusText);
    if (d.error === 'history disabled') {
      chart.innerHTML = ''; // historyNote is already set by refreshDelays()
      document.getElementById('lineFilter').hidden = true;
      return;
    }
    renderPunctualityChart(d);
  } catch (err) {
    document.getElementById('lineFilter').hidden = true;
    chart.innerHTML = `<div class="err">${friendlyError(err)} <button type="button" class="retry" data-retry="punctuality">Erneut versuchen</button></div>`;
  }
}

function restartRefreshBar() {
  const fill = document.getElementById('refreshBarFill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  void fill.offsetWidth; // force reflow so the next transition starts from 0%
  fill.style.transition = `width ${refreshSeconds}s linear`;
  fill.style.width = '100%';
}

function refreshAll() {
  refreshLive();
  refreshDelays();
  refreshPunctuality();
  restartRefreshBar();
}

async function init() {
  try {
    const res = await fetch('api/config');
    if (res.ok) {
      const cfg = await res.json();
      refreshSeconds = cfg.dashboard_refresh_seconds || 15;
    }
  } catch (err) { /* defaults */ }
  initLineFilter();
  initToggleGroup('punctualityWindow', (v) => { punctualityWindow = v; refreshPunctuality(); });
  initToggleGroup('heatmapWindow', (v) => { heatmapWindow = v; refreshHeatmap(); });
  initToggleGroup('heatmapDays', (v) => { heatmapDays = v; refreshHeatmap(); });
  if (hiddenLines.size) { saveHiddenLines(); syncLinesToUrl(); }
  refreshAll();
  setInterval(refreshAll, refreshSeconds * 1000);
  refreshHeatmap();
  setInterval(refreshHeatmap, HEATMAP_REFRESH_SECONDS * 1000);
  document.body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-retry]');
    if (!btn) return;
    if (btn.dataset.retry === 'live') refreshLive();
    else if (btn.dataset.retry === 'delays') refreshDelays();
    else if (btn.dataset.retry === 'punctuality') refreshPunctuality();
    else if (btn.dataset.retry === 'heatmap') refreshHeatmap();
  });
}

init();
</script>
</body>
</html>
