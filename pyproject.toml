[project]
name = "kvb-hafas-client"
version = "0.1.0"
description = "Inoffizieller Python-Client für die HAFAS-Echtzeitdaten der KVB (Kölner Verkehrs-Betriebe)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kvb_hafas"]
