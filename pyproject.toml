[project]
name = "kvb-hafas-client"
version = "2026.9.0"
description = "Inoffizieller Python-Client für die HAFAS-Echtzeitdaten der KVB (Kölner Verkehrs-Betriebe)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kvb_hafas"]
# non-.py webui assets (HTML/CSS/vendored Leaflet) aren't picked up by hatchling's
# default .py-only package scan, so list them explicitly.
artifacts = [
    "kvb_hafas/webui/*.html",
    "kvb_hafas/webui/*.css",
    "kvb_hafas/webui/vendor/*.css",
    "kvb_hafas/webui/vendor/*.js",
    "kvb_hafas/webui/vendor/images/*.png",
]
